<style>

}
:root[data-theme="dark"]{--bg:#0e161b;--card:#152028;--ink:#e8eef2;--mute:#9aacb4;--line:#314049;--soft:#1c282f;--crim:#e05a6c;--crim2:#f08a98;--blue:#7fb0dc;--teal:#4fc1b4;--amber:#e6a35a;--green:#6cc497;--violet:#b49af2;--grey:#6b7d89}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--blue)}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:700;letter-spacing:0;margin:0}
.skip{position:absolute;left:-999px;top:0;background:var(--card);padding:8px 12px;z-index:50}
.skip:focus{left:12px;top:12px}
/* header */
header.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.topin{max-width:1240px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{width:44px;height:44px;border-radius:10px;background:var(--crim);color:#fff;display:grid;place-items:center;font:700 13px/1 var(--serif);flex:0 0 auto}
.brand h1{font-size:21px;line-height:1.15}
.brand small{display:block;color:var(--mute);font-size:12.5px;margin-top:2px}
.toplinks{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;text-decoration:none;color:var(--ink);cursor:pointer;min-height:36px}
.btn:hover{border-color:var(--crim)}
.btn.pri{background:var(--crim);border-color:var(--crim);color:#fff}
nav.tabs{max-width:1240px;margin:0 auto;padding:0 24px 10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin}
@media (min-width:1000px){nav.tabs{flex-wrap:wrap;overflow:visible}}
nav.tabs a{flex:0 0 auto;text-decoration:none;color:var(--mute);font-weight:600;font-size:13.5px;padding:8px 13px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
nav.tabs a:hover{color:var(--ink);border-color:var(--line)}
nav.tabs a[aria-current="page"]{background:var(--crim);color:#fff}
main{max-width:1240px;margin:0 auto;padding:22px 24px 60px}
/* page head */
.phead{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--crim);border-radius:12px;padding:18px 22px;margin-bottom:18px;box-shadow:var(--shadow)}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--crim)}
.phead h2{font-size:26px;margin-top:4px}
.phead p{margin:6px 0 0;color:var(--mute);max-width:900px}
/* cards */
.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.sec h3{font-size:19px}
.why{color:var(--mute);margin:4px 0 14px;font-size:14px;max-width:900px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:980px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.g4,.g3,.g2{grid-template-columns:1fr}.topin,nav.tabs,main{padding-left:16px;padding-right:16px}.phead h2{font-size:22px}}
.kpi{border:1px solid var(--line);border-radius:10px;padding:13px 14px;background:var(--card);position:relative;min-width:0}
.kpi .k{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--mute)}
.kpi .v{font:700 27px/1.15 var(--serif);margin-top:6px;font-variant-numeric:tabular-nums}
.kpi small{display:block;color:var(--mute);font-size:12.5px;margin-top:4px}
.kpi.click{cursor:pointer}.kpi.click:hover{border-color:var(--crim)}
/* provenance chips */
.tag{display:inline-block;font:700 10px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;padding:4px 6px;border-radius:4px;border:1px solid;white-space:nowrap;vertical-align:middle}
.t-pub{background:#e7f4ec;color:#15803d;border-color:#bfe3cc}
.t-smp{background:#fff1dc;color:#9a4b07;border-color:#f3cf98}

.t-asm{background:#eef1f4;color:#475569;border-color:#d7dde3}

.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--mute);align-items:center}

th{background:var(--soft);font-weight:600;color:var(--mute);font-size:12px;letter-spacing:.04em;text-transform:uppercase;position:sticky;top:0}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mis{background:#2a1a1f;border-color:#5a2a33}:root:not([data-theme="light"]) .best{background:#17243a;border-color:#2d4a72}}
.mis b{color:var(--crim)}.best b{color:var(--blue)}
.small{font-size:13px}.muted{color:var(--mute)}
.list{margin:6px 0 0;padding-left:18px}.list li{margin:3px 0}
.foot{max-width:1240px;margin:0 auto;padding:0 24px 40px;color:var(--mute);font-size:12.5px}
.cal{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:980px){.cal{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.cal{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mo{border:1px solid var(--line);border-radius:10px;padding:10px;min-height:120px;background:var(--card)}
.mo h4{margin:0 0 6px;font:700 13px/1.2 var(--sans);color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
.mo.now{border-color:var(--crim);box-shadow:inset 0 0 0 1px var(--crim)}
.ev{font-size:12px;padding:4px 6px;border-radius:6px;margin-bottom:4px;background:var(--soft);border-left:3px solid var(--blue)}
.ev.nih{border-left-color:var(--crim)}.ev.rep{border-left-color:var(--teal)}.ev.pol{border-left-color:var(--violet)}
.dlg{position:fixed;inset:0;background:rgba(10,18,24,.5);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
.dlg.on{display:flex}
.dlg .box{background:var(--card);border-radius:12px;max-width:640px;width:100%;max-height:85vh;overflow:auto;padding:20px 22px;border:1px solid var(--line)}
.dlg .box h3{font-size:20px;margin-bottom:6px}
.close{float:right}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
main:focus,main:focus-visible{outline:none}
@media print{header.top,nav.tabs,.toplinks{display:none}.sec,.phead{box-shadow:none;break-inside:avoid}}
.t-usr{background:#e0f2f1;color:#0f766e;border-color:#a7d9d4}
nav.tabs a .tn{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--soft);color:var(--mute);font-size:10.5px;margin-right:6px}
nav.tabs a[aria-current="page"] .tn{background:rgba(255,255,255,.25);color:#fff}
code{background:var(--soft);padding:1px 5px;border-radius:4px;font-size:12.5px}
.pslinks{display:flex;flex-wrap:wrap;gap:6px}.pslinks a{font-size:12.5px;padding:4px 9px;border:1px solid var(--line,#D5DAE0);border-radius:999px;text-decoration:none;color:inherit;max-width:100%}.pslinks a:hover,.pslinks a:focus-visible{border-color:#0F766E;color:#0F766E}
.grid>*{min-width:0}
.ibtn{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;cursor:pointer;color:var(--blue);vertical-align:middle;margin-left:6px}.ibtn:hover{border-color:var(--blue)}
.dlg .box{max-width:720px}
</style>

<script>

'use strict';
/* =====================================================================
   HMS Advancement Operations (demo) · school-level, DBMI as one unit
   Layers: PUBLISHED (quoted with a source) · SAMPLE (invented, calibrated to published totals)
           MODEL (computed from stated inputs) · ASSUMPTION (an input you can change)
   No donor names, no HMS internal data, no API keys. Constituents appear only as codes.
   ===================================================================== */
const SRC={
 dr24:['Dean’s Report FY24: fundraising update','Harvard Medical School','FY2024','https://hms.harvard.edu/about-hms/office-dean/deans-report/fundraising-update','In FY24, 3,546 alumni, friends, faculty, staff, foundations and corporations gave nearly $118 million to HMS.'],
 crim25:['HMS donations after the federal funding cuts','The Harvard Crimson','19 Jul 2025','https://www.thecrimson.com/article/2025/7/19/hms-donations-blavatnik-trump/','About 4,000 alumni and other donors gave in FY2025, including 700 first-time donors after April; more than $8 million supported MD-PhD students and $4.4 million postdoctoral fellows; one gift of $18.86 million included $5.75 million for junior faculty doing basic research on the Quad.'],
 endow:['Fact and fiction about the HMS endowment','Harvard Medical School','31 Mar 2025','https://hms.harvard.edu/news/fact-fiction-about-hms-endowment','HMS endowment about $5.4 billion from roughly 1,400 gifts; about 90% restricted by donors (about 80% University-wide); endowment income 27% of HMS operating revenue in FY2024; annual payout rates 4.2% to 6.1% from 2007 to 2024; roughly one-third of HMS gifts must be used at affiliated hospitals.'],
 alum26:['Your giving impact: HMS alumni','HMS Office of Alumni Affairs and Development','FY2026','https://impact.hms.harvard.edu/alumni','In FY2026, 1,964 alumni gave more than $19 million. On average 22% of alumni give each year, against 7% at peer institutions. Leadership donors gave 93% of annual funds raised; nearly 600 MD donors gave at the Dean’s Council level.'],
 alum25:['Alumni rally for HMS and each other','HMS Pulse','FY2025','https://pulseimpact.hms.harvard.edu/news/alumni-rally-hms-each-other','Gifts from MD alumni totaled $11 million in FY2025.'],
 honor25:['Honor Roll of Donors, fiscal year 2025','HMS Alumni','FY2025','https://alumni.hms.harvard.edu/give/honor-roll-donors','In fiscal year 2025, 2,339 alumni gave to HMS.'],
 aad:['Contact Alumni Affairs and Development','Harvard Medical School','accessed 26 Oct 2026','https://hms.harvard.edu/departments/giving/contact-aad','AAD includes principal and major gifts, gift planning, donor relations and stewardship, development communications, development services and operations, development technology, development research, alumni engagement, and the Board of Fellows.'],
 hufy26:['Harvard University Financial Overview, FY2026','Harvard Financial Administration','Oct 2026','https://finance.harvard.edu/fy26-financial-overview','Total gifts more than $1.5 billion; current-use gifts $684 million (a record, up 9%); gifts to the endowment more than $525 million; endowment about $68 billion; distribution $2.6 billion; philanthropy 48% of operating revenue.'],
 hmag26:['Harvard stabilizes finances with strong endowment returns, philanthropy (FY2026)','Harvard Magazine','15 Oct 2026','https://www.harvardmagazine.com/university-finances/fy26-annual-financial-report','The endowment tax rises from 1.4% to 8% from FY2027 (about $300 million a year); the FY2027 endowment distribution is flat.'],
 sos26:['HMS Dean outlines strategic plan amid federal funding cuts','The Harvard Crimson','17 Sep 2026','https://www.thecrimson.com/article/2026/9/17/hms-dean-strategic-plan/','HMS federal revenue fell 17% in FY2026; the plan includes an “AI-enabled campus” and deeper industry partnerships.'],
 vse25:['CASE Insights on Voluntary Support of Education, FY2025','CASE','14 Apr 2026','https://www.case.org/resources/insights-voluntary-support-education-2025','Giving to U.S. colleges and universities reached an estimated $78.8 billion in FY2025, up 4%; 81% of contributions designated for specific uses.'],
 gusa25:['Giving USA 2025: giving hit $592.5 billion in 2024','The NonProfit Times','24 Jun 2025','https://thenonprofittimes.com/?p=214806','Total U.S. giving $592.5 billion in 2024, up 6.3% (3.3% after inflation). Individuals $392.45 billion (66%), foundations $109.81 billion (19%), bequests $45.84 billion (8%), corporations 7%. Education third, $2.83 billion behind human services ($91.15 billion).'],
 fep25:['AFP Fundraising Effectiveness Project, Q4 2025 (summary)','DonorPerfect, summarizing the FEP','17 Jul 2026','https://www.donorperfect.com/nonprofit-technology-blog/fundraising-software/afp-fep-q4-2025/','Overall donor retention 43.3% in 2025 (43.1% in 2024); dollars up about 5.0%; donors down about 3.6%. All U.S. nonprofits.'],
 aem:['CASE Insights on Alumni Engagement','CASE','current page','https://case.org/resources/alumni-engagement-metrics-2019','Measures alumni engagement in four modes: philanthropic, volunteer, experiential and communications; results can support a single measure such as the share of alumni engaged in at least one mode.'],
 irs:['Charitable contributions: written acknowledgments','IRS','current page','https://www.irs.gov/charities-non-profits/charitable-organizations/charitable-contributions-written-acknowledgments','A gift of $250 or more needs a written acknowledgment with the amount (or description of property) and whether goods or services were provided, with a good-faith estimate of their value.'],
 p1771:['Publication 1771','IRS','current edition','https://www.irs.gov/pub/irs-pdf/p1771.pdf','Payments over $75 that are partly for goods or services need a written disclosure; the $250 acknowledgment is due by the earlier of the filing date or return due date; separate gifts under $250 are not aggregated.'],
 s117:['Section 117 of the Higher Education Act','Congressional Research Service','25 Mar 2026','https://www.everycrsreport.com/files/2026-03-25_IF12927_9e4e5e294f0adad0cb71eb69f92bbb9dca10fd61.html','Foreign gifts and contracts of $250,000 or more from one source in a calendar year are reported by January 31 or July 31; the DETERRENT Act (not law) would lower the threshold to $50,000.'],
 giftpol:['Gift vs. Sponsored Research Policy: quick reference','Harvard Office for Sponsored Programs','current page','https://osp.finance.harvard.edu/gift-vs-sponsored-research-policy-quick-reference-policy-summary.md','Gifts have no deliverables, no period of performance and are documented by a letter of intent; sponsored awards implement a specific plan with deliverables and a binding agreement.'],
 hmsai:['AI tools at HMS','HMS IT','accessed 25 Oct 2026','https://it.hms.harvard.edu/service/ai-tools','Claude, ChatGPT Edu and Copilot Premium for eligible Quad-based employees after training; Level 3 data and below, never Level 4 or 5; meeting assistants only up to Level 2.'],
 nist:['AI Risk Management Framework (NIST AI 100-1)','NIST','26 Jan 2023','https://www.nist.gov/itl/ai-risk-management-framework','Govern, map, measure, manage.']
};

/* ---------------- utilities ---------------- */
const $=s=>document.querySelector(s);
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fm=(v,d=1)=>(v<0?'−':'')+'$'+Math.abs(v).toFixed(d)+'M';
const fk=v=>(v<0?'−':'')+'$'+Math.round(Math.abs(v)).toLocaleString()+'K';
const fK=v=>Math.abs(v)>=1000000?'$'+(v/1000000).toFixed(2)+'B':Math.abs(v)>=1000?fm(v/1000,Math.abs(v)>=100000?0:1):fk(v); /* v in $K */
const pc=(v,d=0)=>(v*100).toFixed(d)+'%';
const nf=v=>Math.round(v).toLocaleString();
const TAG={usr:['Your data','t-usr'],pub:['Published','t-pub'],smp:['Sample','t-smp'],mod:['Model','t-mod'],asm:['Assumption','t-asm'],doc:['Document','t-doc']};
const tag=t=>`<span class="tag ${TAG[t][1]}" title="${E({usr:'Uploaded in Sources & setup; stays in this browser.',pub:'Quoted from a published source; open Sources for the citation.',smp:'Invented to show the shape of the report, calibrated to published HMS totals where noted. Not HMS data.',mod:'Calculated from the stated inputs. Not a count and not a decision.',asm:'An input you can change.',doc:'Rule or date taken from a policy page.'}[t])}">${TAG[t][0]}</span>`;
const sc=(k,label)=>{const s=SRC[k];return s?`<a href="${E(s[3])}" target="_blank" rel="noopener">${E(label||s[1]+', '+s[2])}</a>`:''};

 const prevAf=new Set(PEOPLE.filter(p=>p.g[2025]&&stOf(p,2025)==='af').map(p=>p.id)),ret0=prevAf.size?af.filter(p=>prevAf.has(p.id)).length/prevAf.size:0.6,newBase=d0*(1-ret0),fd=fdBase(),mg=histMajor();
 for(let k=0;k<runs;k++){const y=Array(N).fill(0);let d=d0;
  for(let i=0;i<N;i++){d=d*o.ret+newBase*o.newM;y[i]+=d*avg*o.avgM*Math.exp(norm(r)*0.05)+fd*Math.exp(norm(r)*0.2)+mg*o.closeM*Math.exp(norm(r)*0.35-0.06)}
  PROS.filter(x=>x.st==='Solicit').forEach(x=>{if(r()<Math.min(0.9,0.45*o.closeM)&&r()<0.1)y[0]+=x.ask*Math.exp(norm(r)*0.4-0.08)}); /* proposals out now: extra lift in year one */
  for(let i=0;i<N;i++){let n=0;const L=Math.max(0,o.pg);let pz=Math.exp(-L),pp=pz,u=r();while(u>pp&&n<20){n++;pz*=L/n;pp+=pz}for(let j=0;j<n;j++)y[i]+=Math.exp(Math.log(1500)+norm(r)*0.9)}
  y.forEach((v,i)=>out[i].push(v))}
 return {p10:out.map(a=>q(a,.1)),p50:out.map(a=>q(a,.5)),p90:out.map(a=>q(a,.9)),ret0};
}
function sumF(o){const R=forecast(o,160);return R.p50.reduce((a,b)=>a+b,0)}
function pPublished(){
 const hms=bars([{l:'FY2024',parts:[['Raised',118,'#9d2235']]}],{fmt:v=>'$'+v+'M',total:true,label:'HMS raised FY2024',w:300,h:220});
 const don=bars([{l:'FY2024',parts:[['Donors',3546,'#94a3b8']]},{l:'FY2025',parts:[['Donors',4000,'#9d2235']]}],{fmt:nf,total:true,label:'HMS donors',w:340,h:220});
 const alum=bars([{l:'FY2025',parts:[['MD alumni giving',11,'#94a3b8']]},{l:'FY2026',parts:[['Alumni giving',19,'#9d2235']]}],{fmt:v=>'$'+v+'M',total:true,label:'HMS alumni giving',w:340,h:220});
 const usa=hbars([['Individuals',392.45,'#9d2235'],['Foundations',109.81,'#2b5c8a'],['Bequests',45.84,'#6d28d9'],['Corporations (≈7%)',44.5,'#b45309']],{fmt:v=>'$'+v.toFixed(1)+'B',label:'U.S. giving by source 2024',w:560,l:170});
 const S=state.fc,o=Object.assign({},SCN[S.k][2],S.over),R=forecast(o,600),hist=[2024,2025,2026].map(fy=>fyTotal(fy));
 const labs=['FY24','FY25','FY26','FY27','FY28','FY29','FY30','FY31'];
 const ch=lines(labs,[{n:'Middle path',c:'#9d2235',v:[null,null,hist[2]].concat(R.p50.map(Math.round)),lo:[null,null,hist[2]].concat(R.p10.map(Math.round)),hi:[null,null,hist[2]].concat(R.p90.map(Math.round))},{n:'Sample history',c:'#152430',v:hist.map(Math.round).concat([null,null,null,null,null]),nolab:true}],{fmt:fK,label:'Gift income forecast',split:2,min:0});
 const alumN=PEOPLE.filter(p=>p.alum).length,partH=YRS.map(fy=>fyDonors(fy,p=>p.alum)/alumN*100);
 return head('Published data & forecast','What the public numbers say, and where gift income could go','HMS, Harvard and national giving as published, then a forecast of HMS gift income from the sample: donors by retention, the major-gift pipeline, planned-gift realizations and foundations. Published points link to their source.')
 +`<div class="grid g3"><div class="sec"><h3>HMS raised, FY2024</h3>${hms}<p class="cap">${tag('pub')} Nearly $118M from 3,546 donors (${sc('dr24','Dean’s Report')}). Later totals are not published here.</p></div><div class="sec"><h3>HMS donors</h3>${don}<p class="cap">${tag('pub')} FY2025 “about 4,000,” including 700 first-time donors after April (${sc('crim25','Crimson')}).</p></div><div class="sec"><h3>HMS alumni giving</h3>${alum}<p class="cap">${tag('pub')} MD alumni $11M in FY2025 (${sc('alum25','HMS Pulse')}); 1,964 alumni gave more than $19M in FY2026 (${sc('alum26','AAD')}). Definitions may differ.</p></div></div>`
 +`<div class="grid g2"><div class="sec"><h3>Who gives in the U.S.</h3>${usa}<p class="cap">${tag('pub')} 2024 total $592.5B, up 6.3% (${sc('gusa25','Giving USA via NonProfit Times')}); corporations shown at 7% of the total. Education about $88.3B (${tag('mod')} derived: $2.83B behind human services at $91.15B).</p></div>
 <div class="sec"><h3>Benchmarks</h3><div class="grid g2">${kpi('U.S. higher-ed giving FY2025','$78.8B','pub','up 4% ('+sc('vse25','CASE')+')')}${kpi('Harvard gifts FY2026','> $1.5B','pub','current use $684M ('+sc('hufy26','Harvard')+')')}${kpi('Donor retention 2025','43.3%','pub','all U.S. nonprofits ('+sc('fep25','FEP')+')')}${kpi('HMS endowment','≈ $5.4B','pub','27% of revenue ('+sc('endow','HMS')+')')}</div></div></div>`
 +`<div class="sec"><h3>HMS gift income: sample history and forecast ${info('fc')}</h3><div class="ctrls"><div class="seg" role="group" aria-label="Scenario">${Object.entries(SCN).map(([k,s])=>`<button type="button" data-scn="${k}" aria-pressed="${S.k===k}">${s[0]}</button>`).join('')}</div>
 <div class="ctrl"><label for="fret">Annual-donor retention</label><input id="fret" type="range" min="0.4" max="0.8" step="0.01" value="${o.ret}"><output>${pc(o.ret)}</output></div>
 <div class="ctrl"><label for="fnew">New donors (× today)</label><input id="fnew" type="range" min="0.5" max="1.5" step="0.05" value="${o.newM}"><output>${o.newM.toFixed(2)}×</output></div>
 <div class="ctrl"><label for="fclose">Major-gift close rate (×)</label><input id="fclose" type="range" min="0.5" max="1.5" step="0.05" value="${o.closeM}"><output>${o.closeM.toFixed(2)}×</output></div>
 <div class="ctrl"><label for="fpg">Planned gifts a year</label><input id="fpg" type="range" min="0" max="8" step="1" value="${o.pg}"><output>${o.pg}</output></div></div>
 ${ch}${t2(['Fiscal year','Low (10th)','Middle path','High (90th)'],R.p10.map((v,i)=>['FY'+(2027+i),fK(v),'<b>'+fK(R.p50[i])+'</b>',fK(R.p90[i])]))}
 <p class="cap">${tag('mod')} on the ${tag('smp')} ledger calibrated to FY2024’s published total. ${E(SCN[S.k][1])}. All inputs ${tag('asm')}.</p></div>`
 +`<div class="sec"><h3>Alumni participation, sample history</h3>${lines(YRS.map(y=>'FY'+String(y).slice(2)),[{n:'Sample',c:'#2b5c8a',v:partH.map(v=>+v.toFixed(1))}],{fmt:v=>v.toFixed(0)+'%',label:'Alumni participation',ref:22,refLab:'HMS average 22%',min:0,w:900,h:260})}<p class="cap">${tag('smp')} line; ${tag('pub')} reference: 22% average, against 7% at peers (${sc('alum26','AAD')}).</p></div>`;
}

/* ---------------- uploaded totals ---------------- */
function parseCSV(t){const rows=[];let row=[],f='',qq=false;for(let i=0;i<t.length;i++){const c=t[i];if(qq){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else qq=false}else f+=c}else if(c==='"')qq=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';if(row.some(x=>x!==''))rows.push(row);row=[]}else f+=c}row.push(f);if(row.some(x=>x!==''))rows.push(row);return rows}
function totalsFromRows(rows){const h=rows[0].map(x=>x.trim().toLowerCase()),ix=k=>h.indexOf(k),miss=['fiscal_year','stream','amount_k'].filter(k=>ix(k)<0);if(miss.length)throw new Error('Missing columns: '+miss.join(', '));
 const o={};rows.slice(1).forEach((r,n)=>{const fy=parseInt(r[ix('fiscal_year')],10),st=String(r[ix('stream')]||'').trim().toLowerCase(),a=parseFloat(r[ix('amount_k')]);if(!isFinite(fy)||!isFinite(a))throw new Error('Row '+(n+2)+': fiscal_year and amount_k must be numbers');if(!STN[st])throw new Error('Row '+(n+2)+': stream must be one of '+Object.keys(STN).join(', '));o[fy]=o[fy]||{};o[fy][st]=(o[fy][st]||0)+a});
 if(!Object.keys(o).length)throw new Error('No rows found');return o}
(function(){const u=LS.get('totals',null);if(u&&typeof u==='object'&&Object.keys(u).length){OVR=u;USERG=true}})();

const state={inv:{thr:0.5},al:{pool:12000,w:{aid:3,dean:2,quad:3,fac:2,init:2,train:2}},en:{rate:0.05},gc:{goal:1250000,lead:0.12,ratio:3},wo:0.05,
 cap:{off:10,port:80,visits:110,qmin:0.15,cost:180,roi:3},camp:{goal:1250000,yrs:7,close:1,trans:0.12,afg:0.03},
 ready:{s:{case:3,lead:3,pipe:3,staff:2,data:3,stew:4},w:{case:2,lead:2,pipe:3,staff:1,data:1,stew:1}},fc:{k:'base',over:{}},fcs:null};
state.fcs=Object.assign({},SCN.base[2]);
const RENDER={command:pCommand,charter:pCharter,inventory:pInventory,funding:pFunding,lifecycle:pLifecycle,scorecard:pScorecard,risk:pRisk,capacity:pCapacity,roadmap:pRoadmap,governance:pGovernance,ai:pAI,setup:pSetup,published:pPublished};
const ALIAS={index:'command',campaign:'roadmap',models:'inventory',forecast:'published',compliance:'risk',sources:'setup'};
function page(){const h=location.hash.slice(1);return RENDER[h]?h:(ALIAS[h]||'command')}
const OFAMAP={command:'index',charter:'charter',inventory:'inventory',funding:'funding',lifecycle:'lifecycle',scorecard:'kpi',risk:'mitigate',capacity:'capacity',roadmap:'calendar',governance:'comms',ai:'aiready',setup:'setup',published:'forecast'};
const PLANMAP={command:['1','Executive summary'],charter:['54','Development & Advancement plan'],inventory:['54','Development & Advancement plan'],funding:['22','Funding sources'],lifecycle:['54','Development & Advancement plan'],scorecard:['28','Scorecard'],risk:['26','Risks'],capacity:['38','Resource capacity'],roadmap:['15','Roadmap'],governance:['58','Communications plan'],ai:['57','AI/ML readiness'],setup:['31','Sources'],published:['59','Published data & forecast']};
const lk=(u,t)=>`<a href="${u}" target="_blank" rel="noopener">${E(t)} ↗</a>`;
const planStrip=p=>{const nm=PAGES.find(x=>x[0]===p)[1],B='https://narissa-pgm.github.io/HMS_DBMI/';
 return `<div class="sec planstrip"><h3>Same section in the companion platforms</h3><p class="small" style="margin:0 0 8px">The DBMI Operating Plan and the four platforms share these 13 sections (each opens in a new tab).</p><div class="pslinks">${lk(B+'HMS_DBMI_Development.html#'+p,'DBMI Gift & Development · '+nm)}${lk(B+'HMS_DBMI_Research.html#'+p,'Research & Grants · '+nm.replace('Gift lifecycle','Grant lifecycle'))}${lk(B+'HMS_OFA.html#'+OFAMAP[p],'Faculty Affairs')}${lk(B+'DBMI_Operating_Plan.html#/m/'+PLANMAP[p][0],'Plan '+PLANMAP[p][0]+' · '+PLANMAP[p][1])}</div></div>`};
function paint(keepScroll){
 const p=page(),y=window.scrollY;
 $('#tabs').innerHTML=PAGES.map(([k,n],i)=>`<a href="#${k}"${k===p?' aria-current="page"':''}><span class="tn">${i+1}</span>${n}</a>`).join('');
 try{$('#main').innerHTML=RENDER[p]()+planStrip(p)}catch(e){$('#main').innerHTML='<div class="sec">This page failed to render: '+E(e.message)+'</div>';console.error(e)}
 document.title=(p==='command'?'':PAGES.find(x=>x[0]===p)[1]+' · ')+'HMS Advancement';
 if(keepScroll)window.scrollTo(0,y);
 const cur=document.querySelector('#tabs a[aria-current]');if(cur&&!keepScroll)try{cur.scrollIntoView({block:'nearest',inline:'center'})}catch(e){}
}
$('#foot').innerHTML='Demo build by Narissa Khomkhai, as of '+TODAY.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})+'. Not an official Harvard system. Published figures carry their source; sample data is invented and calibrated only where stated; models run in your browser on that sample; proposals are the author’s. No donor names and no HMS internal data are included.';
window.addEventListener('hashchange',()=>{paint(false);window.scrollTo(0,0);$('#main').focus({preventScroll:true})});
function dl(name,rows){const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function openPop(k){const P=POPS[k];if(!P)return;$('#dlgt').textContent=P[0];$('#dlgb').innerHTML=P[1]+mistake(P[2],P[3]);$('#dlg').classList.add('on');const c=$('#dlg [data-close]');if(c)c.focus()}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-scn],[data-go],[data-csv],[data-tpl],[data-resetled],[data-pop],[data-close]');if(!t){if(e.target.id==='dlg')$('#dlg').classList.remove('on');return}
 if(t.dataset.scn){state.fc={k:t.dataset.scn,over:{}};paint(true)}
 else if(t.dataset.go){location.hash=t.dataset.go}
 else if(t.dataset.pop){openPop(t.dataset.pop)}
 else if(t.hasAttribute('data-close')){$('#dlg').classList.remove('on')}
 else if(t.hasAttribute('data-csv')){const rows=[['fiscal_year','stream','amount_k','layer']];YRS.concat([CURFY]).forEach(fy=>STREAMS.forEach(s=>rows.push([fy,s[0],Math.round(OVR&&OVR[fy]?(OVR[fy][s[0]]||0):fyTotal(fy,(p,f)=>stOf(p,f)===s[0])),OVR?'YOUR DATA':'SAMPLE'])));dl('HMS_gift_totals.csv',rows)}
 else if(t.hasAttribute('data-tpl')){dl('HMS_gift_totals_template.csv',[['fiscal_year','stream','amount_k'],['2025','af','30000'],['2025','mg','55000'],['2025','pg','9000'],['2025','fd','15000'],['2025','co','8000']])}
 else if(t.hasAttribute('data-resetled')){OVR=null;USERG=false;LS.set('totals',null);paint(true)}
});
document.addEventListener('change',e=>{if(e.target.id!=='csvin')return;const f=e.target.files&&e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const o=totalsFromRows(parseCSV(String(rd.result)));OVR=o;USERG=true;LS.set('totals',o);paint(true);const m=$('#csvmsg');if(m)m.innerHTML='<span class="ok">Loaded totals for '+Object.keys(o).length+' fiscal years. Funding & allocation now uses them.</span>'}catch(err){const m=$('#csvmsg');if(m)m.innerHTML='<span class="bad">Could not load: '+E(err.message)+'</span>'}};rd.readAsText(f)});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.go){e.preventDefault();location.hash=e.target.dataset.go}if(e.key==='Escape')$('#dlg').classList.remove('on')});
let tmr=null;

 coff:v=>state.cap.off=v,cport:v=>state.cap.port=v,cvis:v=>state.cap.visits=v,cq:v=>state.cap.qmin=v,ccost:v=>state.cap.cost=v,croi:v=>state.cap.roi=v,
 kgoal:v=>state.camp.goal=v,kyrs:v=>state.camp.yrs=v,kclose:v=>state.camp.close=v,ktrans:v=>state.camp.trans=v,kafg:v=>state.camp.afg=v,
 fret:v=>state.fc.over.ret=v,fnew:v=>state.fc.over.newM=v,fclose:v=>state.fc.over.closeM=v,fpg:v=>state.fc.over.pg=v};
PRI.forEach(p=>SETS['aw_'+p[0]]=v=>state.al.w[p[0]]=v);
['case','lead','pipe','staff','data','stew'].forEach(k=>SETS['rs_'+k]=v=>state.ready.s[k]=v);
const FMT={ithr:v=>v.toFixed(2),erate:v=>pc(v,1),apool:fK,ggoal:fK,glead:v=>pc(v),wo:v=>pc(v),cq:v=>v.toFixed(2),kgoal:fK,ktrans:v=>pc(v,1),kafg:v=>pc(v,1),fret:v=>pc(v),fnew:v=>v.toFixed(2)+'×',fclose:v=>v.toFixed(2)+'×'};
document.addEventListener('input',e=>{
 const id=e.target.id,v=parseFloat(e.target.value),out=e.target.parentNode.querySelector('output');
 if(!SETS[id])return; if(out)out.textContent=FMT[id]?FMT[id](v):v;
 clearTimeout(tmr);tmr=setTimeout(()=>{SETS[id](v);paint(true);const el=document.getElementById(id);if(el)el.focus()},180);
