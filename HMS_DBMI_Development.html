/* ---------- 13. published data & forecast ---------- */
function simulate(o,runs){
 const r=rng(4242),yrs=[CURFY,CURFY+1,CURFY+2,CURFY+3,CURFY+4],N=yrs.length,out=yrs.map(()=>[]);
 const fyStart=new Date(CURFY-1,6,1),el=Math.min(1,Math.max(0,(TODAY-fyStart)/(365*864e5))),ytd=fyTot(CURFY);
 const last=GIFTS.filter(g=>gFY(g)===CURFY-1&&/^AD-/.test(g.donor)),d0=new Set(last.map(g=>g.donor)).size||100,avg=last.length?sum(last,g=>g.amt)/d0:0.4;
 const capW=[[0,18],[1,30],[2,32],[3,15],[4,5]];
 for(let k=0;k<runs;k++){const y=Array(N).fill(0);let donors=d0;
  for(let i=0;i<N;i++){donors=donors*o.ret+o.newD;y[i]+=donors*avg*Math.exp(norm(r)*0.08)}
  const put=(t,amt)=>{if(t>=N)return;if(amt>=250){for(let j=0;j<3&&t+j<N;j++)y[t+j]+=amt/3}else y[t]+=amt};
  PROSPECTS.forEach(p=>{if(p.stage==='Steward'){if(r()<o.renew)put(1+Math.floor(r()*3),CAP[p.cap][1]*0.2*Math.exp(norm(r)*0.4));return}
   const pr=Math.min(0.95,STP[p.stage]*o.close*(p.stage==='Identify'?1:1.2));if(r()>=pr)return;
   put(({Identify:3,Qualify:2,Cultivate:1,Solicit:0})[p.stage]+Math.floor(r()*1.6),pAsk(p)*Math.exp(norm(r)*0.45-0.1))});
  for(let i=1;i<N;i++)for(let j=0;j<o.newP;j++){if(r()<0.29*o.close){const c=wpick(r,capW);put(i+1+Math.floor(r()*1.4),CAP[c][1]*0.25*Math.exp(norm(r)*0.45-0.1))}}
  y[0]*=(1-el); /* the rest of this fiscal year */
  PLEDGES.forEach(p=>{let nx=pledgeNext(p),rem=p.total-p.paid;if(!nx||rem<=0||r()<0.05)return;while(rem>0){const t=nx<TODAY?0:FY(nx)-CURFY;if(t>=N)break;const a=Math.min(p.per,rem);y[t]+=a;rem-=a;nx=new Date(nx.getFullYear()+1,nx.getMonth(),nx.getDate())}});
  y[0]+=ytd;
  y.forEach((v,i)=>out[i].push(v))}
 const q=(a,p)=>{const s=a.slice().sort((x,z)=>x-z);return s[Math.min(s.length-1,Math.floor(p*s.length))]};
 return {yrs,p10:out.map(a=>q(a,0.1)),p50:out.map(a=>q(a,0.5)),p90:out.map(a=>q(a,0.9)),ytd};
}
const SCN={base:['Base','Retention near today’s, typical close rates',{ret:0.46,newD:62,close:1,renew:0.35,newP:10}],down:['Downturn','Donors pull back: lower retention and close rates',{ret:0.38,newD:45,close:0.7,renew:0.25,newP:7}],push:['Pipeline push','Monthly prospect meetings and champions working',{ret:0.5,newD:80,close:1.2,renew:0.45,newP:14}]};

 <div class="sec"><h3>Harvard, FY2026</h3><div class="grid g2">${kpi('Endowment distribution','$2.6B','pub','39% of operating revenue ('+sc('hufy26','Harvard')+')')}${kpi('Current-use gifts','10%','pub','of operating revenue; philanthropy 48% in all')}${kpi('Endowment tax','8%','pub','from FY2027, up from 1.4% ('+sc('hmag26','Harvard Magazine')+')')}${kpi('Donor retention','43.3%','pub','all U.S. nonprofits, 2025 ('+sc('fep25','FEP summary')+')')}</div></div></div>`
 +`<div class="sec"><h3>DBMI gift receipts: history and forecast</h3><p class="why">${tag('mod')} ${600} simulated paths from the ${USERG?'uploaded':'sample'} ledger: this year’s gifts to date plus the rest of the year; annual donors renew at the retention rate and new donors join; prospects close at stage odds with uncertain size and timing; new qualified prospects enter each year and close later; gifts of $250K or more arrive over three years; open pledges are paid with a 5% chance of write-off. Shaded: the 80% range.</p>
 <div class="ctrls"><div class="seg" role="group" aria-label="Scenario">${Object.entries(SCN).map(([k,s])=>`<button type="button" data-scn="${k}" aria-pressed="${S.k===k}">${s[0]}</button>`).join('')}</div>
 <div class="ctrl"><label for="fret">Donor retention</label><input id="fret" type="range" min="0.3" max="0.65" step="0.01" value="${o.ret}"><output>${pc(o.ret)}</output></div>
 <div class="ctrl"><label for="fnew">New donors a year</label><input id="fnew" type="range" min="20" max="150" step="5" value="${o.newD}"><output>${o.newD}</output></div>
 <div class="ctrl"><label for="fnp">New qualified prospects a year</label><input id="fnp" type="range" min="0" max="30" step="1" value="${o.newP}"><output>${o.newP}</output></div>
 <div class="ctrl"><label for="fclose">Close-rate multiplier</label><input id="fclose" type="range" min="0.5" max="1.5" step="0.05" value="${o.close}"><output>${o.close.toFixed(2)}×</output></div>
 <div class="ctrl"><label for="fgoal">Annual goal ($K)</label><input id="fgoal" type="range" min="250" max="5000" step="50" value="${state.goal}"><output>${fK(state.goal)}</output></div></div>
 ${ch}<p class="cap">Dashed amber line: the annual goal (${fK(state.goal)}). ${E(SCN[S.k][1])}. Retention, new donors, close rates and the goal are ${tag('asm')} inputs; 43.3% is the published national retention rate for context (${sc('fep25','FEP summary')}).</p>
 ${t2(['Fiscal year','Low (10th percentile)','Middle path','High (90th percentile)','Against the goal'],R.yrs.map((y,i)=>['FY'+y,fK(R.p10[i]),'<b>'+fK(R.p50[i])+'</b>',fK(R.p90[i]),R.p50[i]>=state.goal?pill('Middle path meets it','p-ok'):R.p90[i]>=state.goal?pill('Possible, not likely','p-warn'):pill('Out of reach','p-bad')]))}

/* ---------------- user gift report (Sources & setup) ---------------- */
function parseCSV(t){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';if(row.some(x=>x!==''))rows.push(row);row=[]}else f+=c}row.push(f);if(row.some(x=>x!==''))rows.push(row);return rows}
function giftsFromRows(rows){
 const h=rows[0].map(x=>x.trim().toLowerCase()),ix=k=>h.indexOf(k),need=['gift_id','date','donor_code','gift_type','priority','amount_k'],miss=need.filter(k=>ix(k)<0);
 if(miss.length)throw new Error('Missing columns: '+miss.join(', '));
 const out=[];rows.slice(1).forEach((r,n)=>{const g=k=>ix(k)>=0?String(r[ix(k)]||'').trim():'';
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(g('date'));if(!m)throw new Error('Row '+(n+2)+': date must be YYYY-MM-DD');
  const d=new Date(+m[1],+m[2]-1,+m[3]),amt=parseFloat(g('amount_k'));if(!isFinite(amt))throw new Error('Row '+(n+2)+': amount_k must be a number');
  let type=GTYPES.find(t=>t.toLowerCase()===g('gift_type').toLowerCase())||'Current use';const pri=PRIN[g('priority').toLowerCase()]?g('priority').toLowerCase():'bridge';
  let ack=null;const am=/^(\d{4})-(\d{2})-(\d{2})$/.exec(g('ack_date'));if(am)ack=Math.max(0,Math.round((new Date(+am[1],+am[2]-1,+am[3])-d)/864e5));
  out.push({id:g('gift_id')||('U-'+(n+1)),date:d,donor:g('donor_code')||('D-'+(n+1)),dtype:g('donor_type')||'Individual',type,pri,amt,ackDays:ack,foreign:/^y/i.test(g('foreign')),endow:/^y/i.test(g('endowed'))})});
 if(!out.length)throw new Error('No gift rows found');return out.sort((a,b)=>a.date-b.date);
}
