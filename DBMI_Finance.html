 ${kfig([[D(c.tot),'charged to NIH, salary and fringe '+MOD,'salary up to the cap × effort × (1 + fringe)'],[D(c.gapT),'cap gap the department covers '+MOD,'salary above the cap × effort × (1 + fringe)'],[P(c.fr,1),'fringe rate '+PUB,chip('F8')],['$228,000','NIH salary cap from Jan 11, 2026 '+PUB,chip('F9')]])}
 ${exhibit('sf1','Cap gap across six sample investigators','Salary above the cap × NIH effort × (1 + 24.1%) · $','F9 F8','Investigators are codes; salaries are sample',hbars(PIS.map(p=>[p[0]+' · '+D(p[1])+' · '+P(p[2]),Math.round(p[3].gapT),p[3].gapT>0?'#B42318':'#2F6B4F']),{f:D,title:'Cap gap',l:280}))}

 ${mb('Budgeting a PI’s NIH effort at full salary, then finding the cap gap at year-end.','Calculate the cap gap for every PI at budget time and fund it explicitly.','Every PI above the cap has a named source for the gap.',['List PIs above $228,000','Multiply by NIH effort and fringe','Fund it in the unrestricted budget'])}`});
MD('F9',3,'F&A recovery & cap exposure','How MTDC is built, what 69% recovers, and what a 15% cap would cost',()=>{const m=mtdc(),fa=m.base*0.69,cap=m.base*0.15;

 <div class="fsls">${sl('m_dir','Total direct costs ($K)',S.dir,100,5000,50,K)}${sl('m_eqp','Equipment items $10K and up ($K)',S.eqp,0,500,10,K)}${sl('m_subn','Number of subawards',S.subn,0,10,1)}${sl('m_suba','Subaward total ($K)',S.suba,0,2000,10,K)}${sl('m_excl','Other exclusions: tuition, patient care, rent ($K)',S.excl,0,500,10,K)}</div>

 ${kfig([[K(m.base),'MTDC '+MOD,''],[K(fa),'F&A recovered at 69.0% '+MOD,chip('F7')],[K(cap),'F&A at a 15% cap '+MOD,chip('F14')],[K(fa-cap),'lost a year under a cap '+MOD,'on this award alone']])}
 ${mb('Treating a subaward as fully excluded from MTDC, or fully included.','Count the first $50,000 of each subaward, exclude the rest, and recheck at each budget period.','MTDC follows 2 CFR 200 as revised Oct 1, 2024.',['Tag equipment at $10,000','Track subaward totals by subrecipient','Recalculate MTDC each budget period'])}`});
MD('F10',3,'Allocation rules & reserves','How unrestricted money is split, and how big the reserve should be',()=>{const M=m5(S.scn),use=M.use[0],months=S.res/(use/12),need=S.target*use/12;
 return `<p class="lead">Unrestricted money is the only money the department can move. It pays the administrative core, the NIH cap gap, start-up commitments and any bridge funding, and what is left builds the reserve.</p>

 ${kfig([[months.toFixed(1)+' months','reserve today '+MOD,K(S.res)+' ÷ '+K(use/12)+' a month'],[K(need),'target reserve '+MOD,S.target+' months'],[K(need-S.res),need>S.res?'to build':'above target',''],[K(BASE5.capgap),'NIH cap gap in the budget '+SMP,'F8']])}
 ${exhibit('al1','Unrestricted uses, FY2027','$K · sample','','Bridge need from the five-year model (F27)',hbars([['Administrative and finance staff',BASE5.admin*1.035,'#2B5C8A'],['NIH cap gap',BASE5.capgap*1.02,'#A51C30'],['Start-up commitments',BASE5.start,'#9A6514'],['Bridge funding (model)',Math.max(0,use-BASE5.admin*1.035-BASE5.capgap*1.02-BASE5.start),'#5B3A8C']],{f:K,title:'Unrestricted uses',l:280}))}
 ${sec('Bridge funding rule '+PROP,t2(['Condition','Rule'],[['Who qualifies','A lab whose federal award ended or was frozen, with a resubmission or new award in view'],['How much','Up to 6 months of salary for people on the award; trainees first'],['From which fund','Departmental discretionary, then the reserve; never restricted funds'],['Who decides','Chair, on the Executive Director’s recommendation'],['Published context','HMS planned bridge, lab and department funds to support an average of 74% of federal sponsored activity '+chip('F4')]].map(r=>['<b>'+esc(r[0])+'</b>',r[1]])))}
 ${mb('Using the reserve for recurring costs, so it is gone when the shock comes.','Fund recurring costs from recurring sources; use the reserve only for one-time bridges, with a written rule.','Reserve spending needs the Chair’s approval and a repayment plan.',['Agree the target with the Chair','Report reserve months monthly','Rebuild after each use'])}`});
MD('F11',3,'Service center (recharge) rates','Cost pools, rates and the break-even band for the two cores',()=>{const C=CORES.map(c=>[c,coreCalc(c)]);
 return `<p class="lead">The cores charge users through Harvard’s Academic Service Center policy: rates are set at least annually from allowable costs, expected usage and last year’s surplus or deficit; the result must stay within 15% of annual operating expenses, and internal users pay the same rate whatever the funding source ${chip('F12')}.</p>
 <div class="g2">${C.map(([c,x])=>`<div class="box"><div class="eyebrow">${esc(c.n)}</div>
  <div class="fsls">${sl('u_'+c.k,'Usage versus plan',S.core[c.k].use,0.6,1.4,0.05,v=>P(v))}${sl('a_'+c.k,'Rate change',S.core[c.k].adj,-0.2,0.2,0.01,v=>(v>0?'+':'')+P(v))}</div>

  ${t2(['Item','Value'],[['Annual cost pool',K(x.cost)],['Planned units',c.units.toLocaleString()+' '+c.unit+'s'],['Prior-year '+(c.prior>0?'surplus':'deficit')+' carried',P(Math.abs(c.prior))],['Rate per '+c.unit,'$'+(x.rate*1000).toFixed(2)],['Revenue at this usage',K(x.rev)],['Result',(x.res>0?'+':'')+P(x.res,1)+' '+(Math.abs(x.res)>0.15?pill('Outside ±15%','pb'):pill('Inside ±15%','pg'))]])}</div>`).join('')}</div>
 ${exhibit('sc1','Cost pool by line','$K · sample','F12','Sample cost pools; fringe at 45.3% of staff salary',bars(CORES.map(c=>({l:c.n.replace('Computational ',''),p:Object.entries(c.cost).map(([k,v],i)=>[k,v,['#2B5C8A','#5B7FA6','#2F6B4F','#9A6514','#5A6371'][i]])})),{f:K,tot:true,w:900,h:300,title:'Cost pools'})+`<p class="small">${[['Staff','#2B5C8A'],['Fringe','#5B7FA6'],['Cloud and hardware or software','#2F6B4F'],['Software or other','#9A6514'],['Other','#5A6371']].map(([t,c])=>`<span style="display:inline-block;width:10px;height:10px;background:${c};margin:0 4px 0 12px"></span>${t}`).join('')}</p>`)}
 ${mb('Setting a low rate to attract users and covering the deficit quietly from discretionary funds.','Set rates at break-even; if the department chooses to subsidize, budget the subsidy openly.','Results stay inside ±15%; anything above is refunded or not carried forward.',['Interim review mid-year','Annual rate documentation to the school','External rates not below internal'])}`});

MD('F12',4,'Sponsored post-award finance','Spending against time on every award, and the closeout clock',()=>{const H=health();
 const W=900,Hh=380,l=60,r=20,t=16,b=44,X=v=>l+v*(W-l-r),Y=v=>t+(1.15-v)/1.15*(Hh-t-b);let g=`<polygon points="${X(0)},${Y(0.15)} ${X(1)},${Y(1.15)} ${X(1)},${Y(0.85)} ${X(0.15)},${Y(0)} ${X(0)},${Y(0)}" fill="#CFE5D8" opacity=".5"/><line x1="${X(0)}" y1="${Y(0)}" x2="${X(1)}" y2="${Y(1)}" stroke="#5A6371" stroke-dasharray="5 4"/>`;
 [0,.25,.5,.75,1].forEach(v=>g+=`<text x="${X(v)}" y="${Hh-b+16}" text-anchor="middle" style="font-size:12px">${P(v)}</text><text x="${l-6}" y="${Y(v)+4}" text-anchor="end" style="font-size:12px">${P(v)}</text>`);
 H.forEach(a=>g+=`<circle cx="${X(a.elapsed)}" cy="${Y(a.spent)}" r="${5+Math.sqrt(a.annual)/6}" fill="${a.spent>1?'#B42318':Math.abs(a.burn)>0.15?'#9A6514':'#2B5C8A'}" fill-opacity=".7" stroke="#fff"><title>${a.id} ${a.mech}: ${P(a.spent)} spent, ${P(a.elapsed)} of time</title></circle><text x="${X(a.elapsed)+9}" y="${Y(a.spent)+4}" style="font-size:11px">${a.id.slice(3)}</text>`);
 g+=`<text x="${(l+W-r)/2}" y="${Hh-6}" text-anchor="middle" style="font-size:12.5px">share of award period elapsed</text><text transform="translate(14 ${(t+Hh-b)/2}) rotate(-90)" text-anchor="middle" style="font-size:12.5px">share of budget spent</text>`;
 return `<p class="lead">Each award should spend roughly in step with time. Awards far above the line run out early; awards far below may lose money at closeout or signal stalled work. Final reports are due within 120 days of the end of the period of performance ${chip('F15')}.</p>
 ${exhibit('pa1','Spent versus time elapsed, every award','Green band: within ±15 points of the line · bubble size = annual direct costs','F15','Sample awards, coded',svg('Burn chart','Awards plotted by time elapsed and budget spent',W,Hh,g))}
 ${t2(['Award','Mechanism','Federal','Annual direct','Elapsed','Spent','Gap','Ends','Closeout due'],H.map(a=>[a.id,a.mech,a.fed?'Yes':'No',K(a.annual),P(a.elapsed),P(a.spent),pill((a.burn>0?'+':'')+Math.round(a.burn*100)+' pts',Math.abs(a.burn)>0.15?'pb':Math.abs(a.burn)>0.08?'pw':'pg'),a.end.toLocaleDateString('en-US',{month:'short',year:'numeric'}),new Date(a.end.getTime()+120*864e5).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})]))}
 ${mb('Finding an overspend at closeout, when the only fix is a late cost transfer.','Review every award monthly against the ±15-point band and correct while the period is open.','Any award outside ±15 points gets a plan at the monthly review.',['Plot every award monthly','Re-budget early with the PI','Start closeout 90 days before the end date'])}`});

 ${kfig([[String(CT.length),'transfers this year '+SMP,''],[String(CT.filter(c=>c.age>90).length),'over 90 days '+SMP,'need school and OSP approval'],[K(CT.filter(c=>c.fed).reduce((s,c)=>s+c.amt,0)),'moved onto or off federal awards '+SMP,''],[P(CT.filter(c=>c.age<=30).length/CT.length),'made within 30 days '+SMP,'target 80% '+PROP]])}

MD('F14',4,'Effort & salary certification','Who certifies, when, and what is still open',()=>`<p class="lead">At Harvard, faculty PIs certify their federal effort annually and non-faculty effort is certified quarterly in ecrt; each window gives 30 calendar days. A reduction of 25% or more in committed effort generally needs prior approval, and certification is part of the Uniform Guidance audit ${chip('F11')}.</p>

MD('F15',4,'Gift & endowment funds','Spending restricted philanthropy as donors intended',()=>`<p class="lead">Gifts and endowment income are restricted by their terms. About 90% of the HMS endowment is donor-restricted, and payout rates ran from 4.2% to 6.1% between 2007 and 2024 ${chip('F6')}. The FY2027 distribution is flat ${chip('F2')}.</p>

 ${mb('Letting a restricted gift sit unspent for years because no one owns the spending plan.','Give each fund an owner and a spending plan, and report use to the donor every year.','Every restricted fund has an owner, a plan and an annual report.',['Quarterly balance review','Spending plan for balances over a year old','Annual stewardship report'])}`);

 <div class="sect-k">FOUR WAYS IN</div><div class="steps">${[['1','#A51C30','Command center','2 minutes','Spending against plan, exceptions, decisions waiting.','F1'],['2','#2F6B4F','Budget & rates','5 minutes','The operating budget, salary and cap, F&A, reserves and recharge.','F7'],['3','#5B3A8C','Fund lifecycle','5 minutes','Post-award burn, cost transfers, effort, restricted gifts.','F12'],['4','#85611F','Outlook','3 minutes','Landing forecast and the five-year reserve model.','F27']].map(s=>`<button type="button" class="stp" style="--sc:${s[1]}" data-go="${s[5]}"><span class="stn"><b>${s[0]}</b><span>${s[3]}</span></span><h2>${s[2]}</h2><p>${s[4]}</p><span class="go">Open →</span></button>`).join('')}</div>
 <div class="stctx" style="border-left-color:#2B5C8A"><p><b>Companions.</b> The finance view sits under the <a class="ext" href="https://narissa-pgm.github.io/HMS_DBMI/DBMI_Operating_Plan.html" target="_blank" rel="noopener">DBMI Operating Plan</a> and next to the <a class="ext" href="https://narissa-pgm.github.io/HMS_DBMI/HMS_DBMI_Research.html#command" target="_blank" rel="noopener">Research & Grants</a> and <a class="ext" href="https://narissa-pgm.github.io/HMS_DBMI/HMS_DBMI_Development.html#command" target="_blank" rel="noopener">Gift & Development</a> platforms.</p></div></div>`}
function renderIndex(){return `<div class="wrap"><div class="hero"><div><div class="eyebrow">Module index</div><h1>The finance draft in 13 sections</h1><p class="lead">${MODS.length} modules, grouped the same way as the operating plan and the platforms. Each opens with a lead, then exhibits with sources, a mistake-and-best-practice panel and, where useful, a calculator.</p></div>${kfig([[String(MODS.length),'modules',''],[String(Object.keys(SRC).length),'published sources',''],['13','sections',''],['6','calculators and models','F8 F9 F10 F11 F23 F27']]).replace('class="kfig"','class="kfig" style="grid-template-columns:repeat(2,minmax(0,1fr))"')}</div>
 <div class="board"><div class="cols">${SECT.map((s,i)=>{const ms=MODS.filter(m=>m.sc===i);return `<div><div class="ph" style="border-color:${s[1]}"><div class="n" style="color:${s[1]}">${String(i+1).padStart(2,'0')} · ${esc(s[0]).toUpperCase()}</div><div class="c">${esc(s[2])}</div></div>${ms.map(card).join('')}</div>`}).join('')}</div></div></div>`}
function renderModule(n){const m=modBy(n);if(!m)return renderIndex();const s=SECT[m.sc],i=MODS.indexOf(m),prev=MODS[i-1],next=MODS[i+1];exCtx.mod=n;exCtx.k=0;let body='';try{body=m.render()}catch(e){body='<p class="callout">This module failed to render: '+esc(e.message)+'</p>';console.error(e)}
 return `<div class="wrap mod"><div class="crumb"><button type="button" class="backidx" data-go="index">← Module index</button><span>›</span><span style="color:${s[1]};font-weight:700">${esc(s[0])}</span><span>›</span><span>${n}. ${esc(m.t)}</span></div>
 <div class="mhead"><span class="ic" style="background:${s[1]}18">${icon(m.sc,s[1])}<span class="num" style="background:${s[1]}">${n}</span></span><div><div class="eyebrow" style="color:${s[1]}">Module ${n} · ${esc(s[0])}</div><h1>${esc(m.t)}</h1></div></div>
 <div class="mbody">${body}</div>
 <div class="mnav">${prev?`<button type="button" data-go="${prev.n}">← ${prev.n}. ${esc(prev.t)}</button>`:'<span></span>'}<button type="button" data-go="index">Module index</button>${next?`<button type="button" class="btnp" data-go="${next.n}">${next.n}. ${esc(next.t)} →</button>`:'<span></span>'}</div></div>`}
function render(keep){parse();const main=$('#main'),y=main.scrollTop;main.innerHTML=route.v==='index'?renderIndex():route.v==='mod'?renderModule(route.m):renderStart();
 $$('.pn').forEach(b=>b.classList.toggle('on',(b.dataset.nav==='start'&&route.v==='start')||(b.dataset.nav==='index'&&route.v==='index')||(b.dataset.nav===route.m)));
 document.title=(route.v==='mod'?route.m+' '+(modBy(route.m)||{}).t+' · ':'')+'DBMI Finance & Budget';if(keep)main.scrollTop=y;else main.scrollTop=0}
window.addEventListener('hashchange',()=>render(false));

/* ---------------- events ---------------- */
function openDlg(t,html){$('#dlgT').textContent=t;$('#dlgB').innerHTML=html;const d=$('#dlg');if(d.showModal&&!d.open)d.showModal()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go],[data-nav],[data-src],[data-scn],[data-tpl],[data-reset],#dlgX');if(!b)return;
 if(b.id==='dlgX'){$('#dlg').close();return}
 if(b.dataset.src){const s=SRC[b.dataset.src];openDlg(b.dataset.src+' · '+STIER[b.dataset.src]+' source',`<p><b>${esc(s[0])}</b><br><span class="muted">${esc(s[1])} · ${esc(s[2])}</span></p><p>${esc(s[4])}</p>${s[5]?`<p class="small muted">Caveat: ${esc(s[5])}</p>`:''}<p><a class="ext" href="${esc(s[3])}" target="_blank" rel="noopener">Open the source ↗</a></p>`);return}
 if(b.dataset.go){go(b.dataset.go);return}if(b.dataset.nav){go(b.dataset.nav);return}
 if(b.dataset.scn){S.scn=b.dataset.scn;Object.assign(S.m5,{base:{fed:-0.05,alloc:-0.02},down:{fed:-0.12,alloc:-0.05},up:{fed:0.02,alloc:0}}[S.scn]);render(true);return}
 if(b.hasAttribute('data-tpl')){const rows=[['fund_type','budget_k','actual_ytd_k','prior_year_k']].concat(FUNDS.map(f=>[f[0],f[2],f[3],f[4]]));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.map(r=>r.join(',')).join('\n')],{type:'text/csv'}));a.download='DBMI_finance_extract_template.csv';document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),300);return}
 if(b.hasAttribute('data-reset')){ORIG.forEach((o,i)=>FUNDS[i].splice(0,o.length,...o));tot();USERX=false;try{localStorage.removeItem('dbmifin_x')}catch(e){}render(true)}});
document.addEventListener('change',e=>{if(e.target.id==='c_typ'){S.typ=e.target.value;render(true);return}if(e.target.id!=='csvin')return;const f=e.target.files&&e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const rows=parseCSV(String(rd.result)),n=applyX(rows);USERX=true;try{localStorage.setItem('dbmifin_x',JSON.stringify(rows))}catch(e){}render(true);const m=$('#csvmsg');if(m)m.innerHTML='<b style="color:#2F6B4F">Loaded '+n+' fund types. The command center, budget and landing forecast now use your extract.</b>'}catch(err){const m=$('#csvmsg');if(m)m.innerHTML='<b style="color:#B42318">Could not load: '+esc(err.message)+'</b>'}};rd.readAsText(f)});
const SETS={c_sal:v=>S.sal=v,c_eff:v=>S.eff=v,m_dir:v=>S.dir=v,m_eqp:v=>S.eqp=v,m_subn:v=>S.subn=v,m_suba:v=>S.suba=v,m_excl:v=>S.excl=v,r_res:v=>S.res=v,r_tgt:v=>S.target=v,u_res:v=>S.core.res.use=v,a_res:v=>S.core.res.adj=v,u_dev:v=>S.core.dev.use=v,a_dev:v=>S.core.dev.adj=v,w_def:v=>S.w6.def=v,w_uns:v=>S.w6.uns=v,w_end:v=>S.w6.end=v,w_burn:v=>S.w6.burn=v,w_ct:v=>S.w6.ct=v,l_pace:v=>S.land.pace=v,m_fed:v=>S.m5.fed=v,m_alloc:v=>S.m5.alloc=v,m_bridge:v=>S.m5.bridge=v,m_wage:v=>S.m5.wage=v};
let tmr=null;document.addEventListener('input',e=>{const id=e.target.id;if(!SETS[id])return;const v=parseFloat(e.target.value);clearTimeout(tmr);tmr=setTimeout(()=>{SETS[id](v);render(true);const el=document.getElementById(id);if(el)el.focus()},150)});
/* search */
const q=$('#q'),sres=$('#sres');
q.addEventListener('input',()=>{const t=q.value.trim().toLowerCase();if(!t){sres.innerHTML='';sres.classList.remove('on');q.setAttribute('aria-expanded','false');return}const hits=MODS.filter(m=>(m.n+' '+m.t+' '+m.d).toLowerCase().includes(t)).slice(0,8);sres.innerHTML=hits.map(m=>`<button type="button" role="option" data-go="${m.n}"><b>${m.n}</b> ${esc(m.t)}</button>`).join('')||'<div class="small muted" style="padding:8px">No module matches.</div>';sres.classList.add('on');q.setAttribute('aria-expanded','true')});
document.addEventListener('click',e=>{if(!e.target.closest('.search')){sres.classList.remove('on')}});
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==q&&!/input|select|textarea/i.test(document.activeElement.tagName)){e.preventDefault();q.focus()}});
render(false);

})();
</script>
</body></html>
