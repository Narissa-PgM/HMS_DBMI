<style>
:root{
  --bg:#eef1f1;--card:#ffffff;--ink:#152430;--mute:#4a5560;--line:#dfe4e6;--soft:#f4f6f6;
  --crim:#9d2235;--crim2:#7d1a2a;--blue:#2b5c8a;--teal:#0f766e;--amber:#b45309;--green:#2f7d4f;--violet:#6d28d9;--grey:#94a3b8;

}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0e161b;--card:#152028;--ink:#e8eef2;--mute:#9aacb4;--line:#314049;--soft:#1c282f;--crim:#e05a6c;--crim2:#f08a98;--blue:#7fb0dc;--teal:#4fc1b4;--amber:#e6a35a;--green:#6cc497;--violet:#b49af2;--grey:#6b7d89}
}
:root[data-theme="dark"]{--bg:#0e161b;--card:#152028;--ink:#e8eef2;--mute:#9aacb4;--line:#314049;--soft:#1c282f;--crim:#e05a6c;--crim2:#f08a98;--blue:#7fb0dc;--teal:#4fc1b4;--amber:#e6a35a;--green:#6cc497;--violet:#b49af2;--grey:#6b7d89}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--blue)}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:700;letter-spacing:0;margin:0}
.skip{position:absolute;left:-999px;top:0;background:var(--card);padding:8px 12px;z-index:50}
.skip:focus{left:12px;top:12px}
/* header */
header.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.topin{max-width:1240px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{width:44px;height:44px;border-radius:10px;background:var(--crim);color:#fff;display:grid;place-items:center;font:700 13px/1 var(--serif);flex:0 0 auto}
.brand h1{font-size:21px;line-height:1.15}
.brand small{display:block;color:var(--mute);font-size:12.5px;margin-top:2px}
.toplinks{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;text-decoration:none;color:var(--ink);cursor:pointer;min-height:36px}
.btn:hover{border-color:var(--crim)}
.btn.pri{background:var(--crim);border-color:var(--crim);color:#fff}
nav.tabs{max-width:1240px;margin:0 auto;padding:0 24px 10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin}
@media (min-width:1000px){nav.tabs{flex-wrap:wrap;overflow:visible}}
nav.tabs a{flex:0 0 auto;text-decoration:none;color:var(--mute);font-weight:600;font-size:13.5px;padding:8px 13px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
nav.tabs a:hover{color:var(--ink);border-color:var(--line)}
nav.tabs a[aria-current="page"]{background:var(--crim);color:#fff}
main{max-width:1240px;margin:0 auto;padding:22px 24px 60px}
/* page head */
.phead{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--crim);border-radius:12px;padding:18px 22px;margin-bottom:18px;box-shadow:var(--shadow)}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--crim)}
.phead h2{font-size:26px;margin-top:4px}
.phead p{margin:6px 0 0;color:var(--mute);max-width:900px}
/* cards */
.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.sec h3{font-size:19px}
.why{color:var(--mute);margin:4px 0 14px;font-size:14px;max-width:900px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:980px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.g4,.g3,.g2{grid-template-columns:1fr}.topin,nav.tabs,main{padding-left:16px;padding-right:16px}.phead h2{font-size:22px}}
.kpi{border:1px solid var(--line);border-radius:10px;padding:13px 14px;background:var(--card);position:relative;min-width:0}
.kpi .k{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--mute)}
.kpi .v{font:700 27px/1.15 var(--serif);margin-top:6px;font-variant-numeric:tabular-nums}
.kpi small{display:block;color:var(--mute);font-size:12.5px;margin-top:4px}
.kpi.click{cursor:pointer}.kpi.click:hover{border-color:var(--crim)}
/* provenance chips */
.tag{display:inline-block;font:700 10px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;padding:4px 6px;border-radius:4px;border:1px solid;white-space:nowrap;vertical-align:middle}
.t-pub{background:#e7f4ec;color:#15803d;border-color:#bfe3cc}
.t-smp{background:#fff1dc;color:#9a4b07;border-color:#f3cf98}
.t-mod{background:#f1ebfd;color:#6d28d9;border-color:#d9c9f7}
.t-asm{background:#eef1f4;color:#475569;border-color:#d7dde3}
.t-doc{background:#e8effd;color:#1d4ed8;border-color:#c6d6f7}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag{filter:saturate(.9) brightness(.92)}}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--mute);align-items:center}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--soft);font-weight:600;color:var(--mute);font-size:12px;letter-spacing:.04em;text-transform:uppercase;position:sticky;top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--soft)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line)}
.ok{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--crim)}
.p-ok{background:#e7f4ec;color:#15803d;border-color:#bfe3cc}.p-warn{background:#fff1dc;color:#9a4b07;border-color:#f3cf98}.p-bad{background:#fbe9ec;color:#9d2235;border-color:#f1c2ca}

svg.ch{width:100%;height:auto;display:block}
svg.ch text{font-family:var(--sans);fill:var(--mute);font-size:11px}
svg.ch .lab{font-weight:600;font-size:12px}
.cap{font-size:12.5px;color:var(--mute);margin-top:8px}

.ctrl label{display:block;font-size:12px;font-weight:600;color:var(--mute);margin-bottom:4px}
.ctrl input[type=number],.ctrl select{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 10px;min-width:120px}
.ctrl input[type=range]{width:200px;accent-color:var(--crim)}
.ctrl output{font-weight:700;margin-left:6px;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--crim);color:#fff}
/* map cards */
.map a{display:block;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--card);transition:border-color .15s}
.map a:hover,.map a:focus-visible{border-color:var(--crim)}
.map b{font-family:var(--serif);font-size:16.5px;display:block}
.map span{display:block;font-size:13px;color:var(--mute);margin-top:3px}
.map i{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--crim)}
.note{border-left:4px solid var(--amber);background:var(--soft);padding:10px 14px;border-radius:6px;font-size:13.5px;margin:0 0 14px}
.note.blue{border-color:var(--blue)}
.callout{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:640px){.callout{grid-template-columns:1fr}}
.mis{border:1px solid #f1c2ca;background:#fbf2f4;border-radius:10px;padding:12px 14px}
.best{border:1px solid #c6d6f7;background:#f1f6fd;border-radius:10px;padding:12px 14px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mis{background:#2a1a1f;border-color:#5a2a33}:root:not([data-theme="light"]) .best{background:#17243a;border-color:#2d4a72}}
.mis b{color:var(--crim)}.best b{color:var(--blue)}
.small{font-size:13px}.muted{color:var(--mute)}
.list{margin:6px 0 0;padding-left:18px}.list li{margin:3px 0}
.foot{max-width:1240px;margin:0 auto;padding:0 24px 40px;color:var(--mute);font-size:12.5px}
.cal{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:980px){.cal{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.cal{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mo{border:1px solid var(--line);border-radius:10px;padding:10px;min-height:120px;background:var(--card)}
.mo h4{margin:0 0 6px;font:700 13px/1.2 var(--sans);color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
.mo.now{border-color:var(--crim);box-shadow:inset 0 0 0 1px var(--crim)}
.ev{font-size:12px;padding:4px 6px;border-radius:6px;margin-bottom:4px;background:var(--soft);border-left:3px solid var(--blue)}
.ev.nih{border-left-color:var(--crim)}.ev.rep{border-left-color:var(--teal)}.ev.pol{border-left-color:var(--violet)}
.dlg{position:fixed;inset:0;background:rgba(10,18,24,.5);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
.dlg.on{display:flex}
.dlg .box{background:var(--card);border-radius:12px;max-width:640px;width:100%;max-height:85vh;overflow:auto;padding:20px 22px;border:1px solid var(--line)}
.dlg .box h3{font-size:20px;margin-bottom:6px}
.close{float:right}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
main:focus,main:focus-visible{outline:none}
@media print{header.top,nav.tabs,.toplinks{display:none}.sec,.phead{box-shadow:none;break-inside:avoid}}
.t-usr{background:#e0f2f1;color:#0f766e;border-color:#a7d9d4}
nav.tabs a .tn{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--soft);color:var(--mute);font-size:10.5px;margin-right:6px}
nav.tabs a[aria-current="page"] .tn{background:rgba(255,255,255,.25);color:#fff}
code{background:var(--soft);padding:1px 5px;border-radius:4px;font-size:12.5px}
.pslinks{display:flex;flex-wrap:wrap;gap:6px}.pslinks a{font-size:12.5px;padding:4px 9px;border:1px solid var(--line,#D5DAE0);border-radius:999px;text-decoration:none;color:inherit;max-width:100%}.pslinks a:hover,.pslinks a:focus-visible{border-color:#0F766E;color:#0F766E}
</style>

const SRC={
 nihfy25:['NIH Extramural Nexus: FY2025 by the numbers','NIH OER','Mar 2026','https://www.grants.nih.gov/news-events/nih-extramural-nexus-news/2026/03/fiscal-year-2025-by-the-numbers-extramural-grant-investments-in-research','RPG and R01-equivalent success rates 13.0% in FY2025 (18.5% and 18.7% in FY2024); 8,161 competing RPG awards (−20.5%) from 62,592 applications (+12.9%); average RPG $675,426; extramural total $35.30B. NIH says more awards were forward funded.'],
 hmsnum:['HMS by the Numbers','Harvard Medical School','Feb 2026 (funding)','https://hms.harvard.edu/about-hms/facts-figures','FY25 grants and contracts expenditures, HMS and affiliated hospitals: $4,566,279,837 total; $2,510,885,713 federal.'],
 fa:['F&A rates, federal sponsors','Harvard Office for Sponsored Programs','7/1/2025–6/30/2028','https://osp.finance.harvard.edu/fa-rates-federal-sponsors','HMS on-campus research 69.0%; other sponsored activities 40.0%; off-campus 26.0% (MTDC base).'],
 fringe:['FY2027 fringe benefit rates','Harvard Office for Sponsored Programs','Jul 2026','https://osp.finance.harvard.edu/fy2027-fringe-benefits-rates','HMS staff 45.3%; academic 24.1%.'],
 sos25:['HMS State of the School 2025','The Harvard Crimson','18 Sep 2025','https://www.thecrimson.com/article/2025/9/18/hms-daley-state-of-the-school','Research spending cut at least 20%; about $230M in grants frozen; $90M University research sustainability funding matched by $120M of HMS bridge funds; bridge funds, lab reserves and departmental funds projected to support an average of 74% of federal sponsored activity; FY2025 federal grants projected at $251M.'],
 sos26:['HMS Dean outlines strategic plan amid federal funding cuts','The Harvard Crimson','17 Sep 2026','https://www.thecrimson.com/article/2026/9/17/hms-dean-strategic-plan/','HMS federal revenue down 17% in FY2026; an $8M budget shortfall closed with strategic reserves, against a nearly $200M loss forecast a year earlier.'],
 hufy26:['Harvard University Financial Overview, FY2026','Harvard Financial Administration','Oct 2026','https://finance.harvard.edu/fy26-financial-overview','Federal sponsored revenue $506M vs $629M in FY2025 (−19.5%); operating surplus $100M.'],
 cap:['NIH 15 percent indirect cost cap: status guide','CASRAI','updated 14 Sep 2026','https://www.casrai.org/guides/nih-15-percent-indirect-cost-cap','The 2025 flat 15% cap was permanently enjoined (First Circuit affirmed 5 Jan 2026). The FY2026 appropriations act kept the rider barring changes; the FY2027 budget request again proposes a 15% cap.'],
 due:['Standard due dates','NIH Grants & Funding','updated 24 Mar 2026','https://grants.nih.gov/grants/how-to-apply-application-guide/due-dates-and-submission-policies/due-dates.htm','R01 new Feb 5, Jun 5, Oct 5; renewals Mar 5, Jul 5, Nov 5. R21/R03 new Feb 16, Jun 16, Oct 16. K new Feb 12, Jun 12, Oct 12. F fellowships Apr 8, Aug 8, Dec 8. T32 Jan 25, May 25, Sep 25. Dedicated AIDS dates ended (NOT-OD-26-029).'],
 rppr:['Research Performance Progress Report','NIH Grants & Funding','current page','https://www.grants.nih.gov/grants-process/post-award-monitoring-and-reporting/reporting-requirements/research-performance-progress-report-rppr','Annual RPPR about 45 days before the next budget period (SNAP) or 60 days (non-SNAP); multi-year funded awards on or before the anniversary; final RPPR 120 days after the period of performance ends.'],
 close:['NIH Grants Policy Statement 8.6: closeout','NIH','current page','https://grants.nih.gov/grants/policy/nihgps/html5/section_8/8.6_closeout.htm','Final FFR, final RPPR and final invention statement due within 120 calendar days of the end of the period of performance; NIH closes unilaterally after one year.'],
 pubacc:['2024 NIH Public Access Policy effective date (NOT-OD-25-101)','NIH','30 Apr 2025','https://grants.nih.gov/grants/guide/notice-files/NOT-OD-25-101.html','Manuscripts accepted on or after 1 Jul 2025 must be publicly available in PMC with no embargo.'],
 dms:['NIH Data Management and Sharing Policy (NOT-OD-21-013)','NIH','effective 25 Jan 2023','https://grants.nih.gov/grants/guide/notice-files/NOT-OD-21-013.html','A data management and sharing plan is required at application, and compliance with the approved plan is expected.'],
 ailimit:['NIH policy on AI use and a PI application limit (summary of NOT-OD-25-132)','Weill Cornell Medicine','accessed 24 Oct 2026','https://research.weill.cornell.edu/about-us/news-updates/nih-update-new-policy-ai-use-pi-application-limit','NIH will not consider applications substantially developed by AI. Each PI may submit at most six new, renewal, resubmission or revision applications per calendar year, from the 25 Sep 2025 receipt date.'],
 ug:['Uniform Guidance (2 CFR 200) revisions, effective 1 Oct 2024','OMB, via GWU sponsored programs','Oct 2024','https://sponsoredprojects.gwu.edu/node/1501','Equipment threshold $10,000; 15% de minimis indirect rate for entities without a negotiated rate.'],
 dbmiproj:['DBMI projects','HMS Department of Biomedical Informatics','accessed 25 Oct 2026','https://dbmi.hms.harvard.edu/projects','Public list of DBMI programs, including NIH Common Fund, NHLBI, NIA and NIEHS consortium and data-coordination work.'],
 peerai:['The use of generative AI technologies is prohibited for the NIH peer review process (NOT-OD-23-149)','NIH','23 Jun 2023','https://grants.nih.gov/grants/guide/notice-files/NOT-OD-23-149.html','NIH reviewers may not use generative AI to analyze or draft critiques; uploading application content to online AI tools breaches review confidentiality.'],
 hmsai:['AI tools at HMS','HMS IT','accessed 25 Oct 2026','https://it.hms.harvard.edu/service/ai-tools','Claude, ChatGPT Edu and Copilot Premium for eligible Quad-based employees and students after training; use with Level 3 data and below, never Level 4 or 5; meeting assistants only up to Level 2.'],
 nist:['AI Risk Management Framework (NIST AI 100-1)','NIST','26 Jan 2023','https://www.nist.gov/itl/ai-risk-management-framework','Four functions for managing AI risk: govern, map, measure, manage.'],
 litig:['Harvard federal research funding litigation','The Harvard Crimson','10 Aug 2026','https://www.thecrimson.com/article/2026/8/10/harvard-funding-appeal-amici/','A September 2025 ruling restored terminated funding; the government appealed. Status after August 2026 not verified.']
};
/* public DBMI programs (DBMI projects page): names and funders only, no dollar values */
const PROGRAMS=[['4D Nucleome DCIC data portal','NIH Common Fund'],['NHLBI BioData Catalyst','NHLBI'],['Undiagnosed Diseases Network','NIH'],['SMaHT data portal','NIH Common Fund'],['AIM-AHEAD infrastructure core','NIH'],['Confluence projects','NIA'],['NEXUS exposome coordination center','NIEHS and other federal agencies'],['HuBMAP data portal','NIH Common Fund (program)'],['IGVF consortium','NIH (program)']];

/* ---------------- utilities ---------------- */
const $=s=>document.querySelector(s);
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fm=(v,d=1)=>(v<0?'−':'')+'$'+Math.abs(v).toFixed(d)+'M';
const fk=v=>'$'+Math.round(v).toLocaleString()+'K';
const pc=(v,d=0)=>(v*100).toFixed(d)+'%';
const TAG={usr:['Your data','t-usr'],pub:['Published','t-pub'],smp:['Sample','t-smp'],mod:['Model','t-mod'],asm:['Assumption','t-asm'],doc:['Document','t-doc']};
const tag=t=>`<span class="tag ${TAG[t][1]}" title="${E({usr:'Uploaded in Sources & setup; stays in this browser.',pub:'Quoted from a published source; open Sources for the citation.',smp:'Invented to show the shape of the report. Not DBMI or Harvard data.',mod:'Calculated from the stated inputs. Not a count and not a decision.',asm:'An input you can change.',doc:'Rule or date taken from a policy page.'}[t])}">${TAG[t][0]}</span>`;
const sc=(k,label)=>{const s=SRC[k];return s?`<a href="${E(s[3])}" target="_blank" rel="noopener">${E(label||s[1]+', '+s[2])}</a>`:''};
const kpi=(k,v,t,note,act)=>`<div class="kpi${act?' click':''}"${act?` role="button" tabindex="0" data-go="${act}"`:''}><div class="k"><span>${E(k)}</span>${tag(t)}</div><div class="v">${v}</div><small>${note}</small></div>`;

function simulate(o,runs){
 const yrs=[];for(let y=CURFY;y<=CURFY+4;y++)yrs.push(y);
 const r=rng(o.seed||99),out=yrs.map(()=>[]),fa=yrs.map(()=>[]);
 for(let k=0;k<runs;k++){
  const tot_=yrs.map(()=>0),fat=yrs.map(()=>0);
  const succ=Math.max(0.02,Math.min(0.6,o.s+norm(r)*0.02)),pren=Math.max(0.05,Math.min(0.9,o.ren+norm(r)*0.06)),term=Math.max(0,o.term+norm(r)*0.01);
  LEDGER.forEach(a=>{let alive=true,end=a.end,dir=a.dir;
   for(let i=0;i<yrs.length;i++){const y=yrs[i];
    if(y>end){ if(a.ren&&y===end+1&&alive&&r()<pren){end=y+4;dir=dir*1.02;} else {alive=false;break;} }
    if(y<a.sy)continue;
    if(a.fed&&i>0&&r()<term){alive=false;break;}
    const faR=a.fed?(o.cap&&y>=CURFY+1?0.15:0.69):a.faRate,f=dir*0.88*faR;
    tot_[i]+=dir+f;fat[i]+=f;}
  });
  /* new awards from the pipeline */
  for(let i=1;i<yrs.length;i++){for(let j=0;j<o.apps;j++){if(r()<succ){const d=o.avg*(0.7+r()*0.6),len=3+Math.floor(r()*3);for(let z=i;z<Math.min(yrs.length,i+len);z++){const f=d*0.88*(o.cap?0.15:0.69);tot_[z]+=d+f;fat[z]+=f}}}}
  tot_.forEach((v,i)=>out[i].push(v/1000));fat.forEach((v,i)=>fa[i].push(v/1000));
 }
 const q=(a,p)=>{const s=a.slice().sort((x,y)=>x-y);return s[Math.floor(p*(s.length-1))]};
 return {yrs,p10:out.map(a=>q(a,.1)),p50:out.map(a=>q(a,.5)),p90:out.map(a=>q(a,.9)),fa50:fa.map(a=>q(a,.5)),last:out[out.length-1]};
}

 return head('Published data & forecast','What the public numbers say, and where the forecast goes','NIH, Harvard and HMS series as published, an HMS federal revenue path built from them, and the department funding forecast. Every published point links to its source; derived and model values are labeled.')
 +`<div class="grid g3"><div class="sec"><h3>NIH success rate</h3>${nih}<p class="cap">${tag('pub')} ${sc('nihfy25','NIH, Mar 2026')}. Applications rose 12.9% to 62,592.</p></div><div class="sec"><h3>NIH competing awards</h3>${awards}<p class="cap">${tag('pub')} −20.5%; average award $675,426 (+8.9%). NIH says more awards were forward funded.</p></div><div class="sec"><h3>Harvard federal sponsored revenue</h3>${harv}<p class="cap">${tag('pub')} −19.5% (${sc('hufy26','Harvard, Oct 2026')}). University-wide, not HMS.</p></div></div>`
 +`<div class="sec"><h3>HMS federal grant revenue: published points and three paths</h3><p class="why">FY2024 “more than $230M” and the FY2025 projection of $251M are published (${sc('sos25','Crimson, Sep 2025')}). FY2026 applies the published −17% (${sc('sos26','Crimson, Sep 2026')}) to the FY2025 projection, so it is ${tag('mod')} derived. Solid crimson: published and derived points. The three dashed paths are scenarios, not forecasts.</p>${hmsCh}
 <div class="grid g4" style="margin-top:12px">${kpi('FY2024','>$230M','pub','HMS federal grants')}${kpi('FY2025 projection','$251M','pub','as stated in Sep 2025')}${kpi('FY2026, derived','≈$'+Math.round(hms26)+'M','mod','$251M × (1 − 17%)')}${kpi('HMS + affiliates, FY25','$2.51B','pub','federal grant spending ('+sc('hmsnum','HMS by the Numbers')+')')}</div></div>`
 +`<h3 style="margin:22px 0 10px;font-size:20px">Department funding forecast</h3>`+embed(pForecast);
}

/* ---------- user ledger (Sources & setup) ---------- */
function LT(){return USERLED?'usr':'smp'}
function parseCSV(t){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';if(row.some(x=>x!==''))rows.push(row);row=[]}else f+=c}row.push(f);if(row.some(x=>x!==''))rows.push(row);return rows}
function ledgerFromRows(rows){
 const h=rows[0].map(x=>x.trim().toLowerCase()),ix=k=>h.indexOf(k),need=['id','mechanism_code','sponsor','federal','start_fy','end_fy','direct_per_year_k'],miss=need.filter(k=>ix(k)<0);
 if(miss.length)throw new Error('Missing columns: '+miss.join(', '));
 const out=[];rows.slice(1).forEach((r,n)=>{const g=k=>ix(k)>=0?String(r[ix(k)]||'').trim():'';const m=g('mechanism_code').toUpperCase();const M=MECH[m]||MECH.R01;const fed=/^y|true|1/i.test(g('federal'));const sy=parseInt(g('start_fy'),10),end=parseInt(g('end_fy'),10),dir=parseFloat(g('direct_per_year_k'));
  if(!isFinite(sy)||!isFinite(end)||!isFinite(dir))throw new Error('Row '+(n+2)+': start_fy, end_fy and direct_per_year_k must be numbers');
  const faRate=g('fa_rate')?parseFloat(g('fa_rate')):(fed?0.69:0.15),sm=parseInt(g('budget_start_month'),10)||7;
  const elapsed=Math.max(0.04,Math.min(1,(((TODAY.getMonth()+1-sm)+12)%12+TODAY.getDate()/30)/12));
  const spent=g('spent_share')?parseFloat(g('spent_share')):elapsed;
  out.push({id:g('id')||('U-'+(n+1)),m:MECH[m]?m:'R01',mech:M.n,sp:g('sponsor')||'Sponsor',fed,ren:M.ren,sy,end,dur:end-sy+1,dir,faRate,fa:Math.round(dir*0.88*faRate),role:'PI',pi:g('investigator_code')||'PI-??',spent,elapsed,snap:/^y/i.test(g('snap')),smonth:sm,effort:'Certified',nce:end===CURFY&&spent<elapsed-0.12})});
 if(!out.length)throw new Error('No award rows found');return out;
}
let USERLED=false;
(function(){const u=LS.get('ledger',null);if(Array.isArray(u)&&u.length){LEDGER=u;USERLED=true}})();

const state={pf:{f:'all'},pp:{p:0.13},ex:{mtdc:LS.get('mtdc',null),frozen:0.3,months:9,cover:0.74},fc:{k:'base',over:{}},inv:{fit:1.5,size:1},al:{c:55,d:35,i:10},cap:{gm:3,hrs:110,prop:40,rppr:8,recon:2,close:16},pub:{}};
const RENDER={command:pCommand,charter:pCharter,inventory:pInventory,funding:pFunding,lifecycle:pLifecycle,scorecard:pScorecard,risk:pRisk,capacity:pCapacity,roadmap:pRoadmap,governance:pGovernance,ai:pAI,setup:pSetup,published:pPublished};
const ALIAS={index:'command',portfolio:'inventory',pipeline:'lifecycle',postaward:'lifecycle',exposure:'funding',forecast:'published',compliance:'risk',sources:'setup'};

const PLANMAP={"command": [["1", "Executive summary"], ["33", "Delivery health"], ["R1", "Research portfolio at a glance"], ["R10", "Escalation queue"]], "charter": [["43", "Initiative charter"], ["8", "Plan on a page"], ["9", "Strategy map"], ["R2", "Alignment & strategy"]], "inventory": [["12", "Programs & initiatives"], ["13", "Value vs feasibility"], ["42", "Portfolio frontier"], ["R5", "Sponsored portfolio"]], "funding": [["19", "Financial plan"], ["22", "Funding sources"], ["4", "Indirect-cost exposure"], ["R13", "Exposure register"], ["R14", "Recovery model"]], "lifecycle": [["56", "Grant lifecycle"], ["R6", "Award lifecycle bridge"], ["R9", "Research administration calendar"], ["R11", "Controls & systems of record"]], "scorecard": [["28", "Scorecard"], ["39", "Benefits register"], ["44", "SMART goals"]], "risk": [["26", "Risks"], ["40", "Risk register"], ["36", "Cost risk simulation"], ["R4", "Research Compliance"]], "capacity": [["37", "Dependencies"], ["38", "Resource capacity"], ["23", "Operating model"]], "roadmap": [["15", "Roadmap"], ["16", "Decision gates"], ["24", "Operating rhythm"], ["50", "Transformation plan"]], "governance": [["25", "Decision rights"], ["7", "Stakeholder map"], ["58", "Communications plan"], ["R12", "Briefing builder"]], "ai": [["57", "AI/ML readiness"], ["49", "Training & adoption"]], "setup": [["29", "Assumptions"], ["31", "Sources"], ["47", "Reports & exports"]], "published": [["59", "Published data & forecast"], ["3", "Harvard & HMS finances"], ["35", "Forecast at completion"]]};
const planStrip=p=>{const m=PLANMAP[p];if(!m)return '';return `<div class="sec planstrip"><h3>Same section in the DBMI Operating Plan</h3><p class="small" style="margin:0 0 8px">The plan and this platform use the same 13 sections. These plan modules cover this one (open in a new tab):</p><div class="pslinks">${m.map(([n,t])=>`<a href="https://narissa-pgm.github.io/HMS_DBMI/DBMI_Operating_Plan.html#/m/${n}" target="_blank" rel="noopener">${n} · ${E(t)} ↗</a>`).join('')}</div></div>`};
function paint(keepScroll){
 const p=page(),y=window.scrollY;
 $('#tabs').innerHTML=PAGES.map(([k,n],i)=>`<a href="#${k}"${k===p?' aria-current="page"':''}><span class="tn">${i+1}</span>${n}</a>`).join('');
 try{$('#main').innerHTML=RENDER[p]()+planStrip(p)}catch(e){$('#main').innerHTML='<div class="sec">This page failed to render: '+E(e.message)+'</div>';console.error(e)}
 document.title=(p==='command'?'':PAGES.find(x=>x[0]===p)[1]+' · ')+'HMS DBMI Research & Grants';
 if(keepScroll)window.scrollTo(0,y);
 const cur=document.querySelector('#tabs a[aria-current]');if(cur&&!keepScroll)try{cur.scrollIntoView({block:'nearest',inline:'center'})}catch(e){}
}
$('#foot').innerHTML='Demo build by Narissa Khomkhai, as of '+TODAY.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})+'. Not an official Harvard system. Published figures carry their source; sample data is invented; proposals are the author’s; model output is not a forecast anyone has approved. No investigator names and no HMS internal data are included.';
window.addEventListener('hashchange',()=>{paint(false);window.scrollTo(0,0);$('#main').focus({preventScroll:true})});
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-pf],[data-scn],[data-go],[data-csv],[data-resetmtdc],[data-close],[data-tpl],[data-resetled]');if(!t)return;
 if(t.dataset.pf){state.pf.f=t.dataset.pf;paint(true)}
 else if(t.dataset.scn){state.fc={k:t.dataset.scn,over:{}};paint(true)}
 else if(t.dataset.go){location.hash=t.dataset.go}
 else if(t.hasAttribute('data-csv')){const h=['id','mechanism_code','sponsor','federal','start_fy','end_fy','direct_per_year_k','fa_rate','investigator_code','layer'],rows=LEDGER.map(a=>[a.id,a.m,a.sp,a.fed?'Y':'N',a.sy,a.end,a.dir,a.faRate,a.pi,USERLED?'YOUR DATA':'SAMPLE']);dl('DBMI_award_ledger.csv',[h].concat(rows))}
 else if(t.hasAttribute('data-tpl')){dl('DBMI_award_ledger_template.csv',[['id','mechanism_code','sponsor','federal','start_fy','end_fy','direct_per_year_k','fa_rate','investigator_code','spent_share','budget_start_month','snap'],['AW-001','U24','NHLBI','Y','2024','2028','2400','0.69','PI-01','0.42','7','N'],['AW-002','R01','NLM','Y','2025','2029','350','0.69','PI-02','0.30','9','Y'],['AW-003','FDN','Private foundation','N','2026','2027','250','0.15','PI-03','0.20','1','N']])}
 else if(t.hasAttribute('data-resetled')){LEDGER=buildLedger();USERLED=false;LS.set('ledger',null);paint(true)}
 else if(t.hasAttribute('data-resetmtdc')){state.ex.mtdc=null;LS.set('mtdc',null);paint(true)}
 else if(t.hasAttribute('data-close')){$('#dlg').classList.remove('on')}
});
function dl(name,rows){const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
document.addEventListener('change',e=>{if(e.target.id!=='csvin')return;const f=e.target.files&&e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const L=ledgerFromRows(parseCSV(String(rd.result)));LEDGER=L;USERLED=true;LS.set('ledger',L);paint(true);const m=$('#csvmsg');if(m)m.innerHTML='<span class="ok">Loaded '+L.length+' awards. Every section now uses your list.</span>'}catch(err){const m=$('#csvmsg');if(m)m.innerHTML='<span class="bad">Could not load: '+E(err.message)+'</span>'}};rd.readAsText(f)});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.go){e.preventDefault();location.hash=e.target.dataset.go}if(e.key==='Escape')$('#dlg').classList.remove('on')});
let tmr=null;
const SETS={pp:v=>state.pp.p=v,frz:v=>state.ex.frozen=v,mon:v=>state.ex.months=v,cov:v=>state.ex.cover=v,fs:v=>state.fc.over.s=v,fr:v=>state.fc.over.ren=v,fa:v=>state.fc.over.apps=v,wfit:v=>state.inv.fit=v,wsize:v=>state.inv.size=v,alc:v=>state.al.c=v,ald:v=>state.al.d=v,ali:v=>state.al.i=v,cgm:v=>state.cap.gm=v,chrs:v=>state.cap.hrs=v,cprop:v=>state.cap.prop=v,crppr:v=>state.cap.rppr=v,crec:v=>state.cap.recon=v};
const FMT={pp:v=>pc(v,1),frz:v=>pc(v),cov:v=>pc(v),fs:v=>pc(v,1),fr:v=>pc(v)};
document.addEventListener('input',e=>{
 const id=e.target.id,v=parseFloat(e.target.value),out=e.target.parentNode.querySelector('output');
 if(id==='mtdc'){if(isFinite(v)&&v>=0){clearTimeout(tmr);tmr=setTimeout(()=>{state.ex.mtdc=v;LS.set('mtdc',v);paint(true);const el=$('#mtdc');if(el)el.focus()},500)}return}
 if(!SETS[id])return; if(out)out.textContent=FMT[id]?FMT[id](v):v;
 clearTimeout(tmr);tmr=setTimeout(()=>{SETS[id](v);paint(true);const el=document.getElementById(id);if(el)el.focus()},160);
});
