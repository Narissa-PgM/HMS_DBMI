MD(1,'case','doc','Executive summary','Thesis, four programs and the investment',null,()=>{const ask=M.inc*(1+S.reserve/100);return `
 <div class="cover"><div class="eyebrow">Program plan · 36 months · proposed</div><h1>Securing the platform for DBMI’s next decade of computational medicine</h1><p class="lead">Protect the research enterprise through a volatile funding period, grow and support the faculty, and make DBMI the HMS model for responsible, cost-recovered AI and computation — delivered largely by redeploying existing capacity, with a targeted incremental investment.</p><div class="by"><span>Prepared by Narissara (Narissa) Khomkhai</span><span>Executive Director search · Department of Biomedical Informatics, HMS</span><span>20 October 2026</span><span>sawatdee@me.com</span></div></div>
 <div class="kfig"><div><div class="v">−19.5%</div><div class="l">Harvard federal research revenue, FY2026</div><div class="s">${chip('S19')}</div></div><div><div class="v">≈ ⅓</div><div class="l">of HMS operating revenue from federal grants (FY2024)</div><div class="s">${chip('S21')}</div></div><div><div class="v">54 pts</div><div class="l">of indirect-cost recovery at stake if a 15% cap replaced HMS’s 69% rate</div><div class="s">${chips('S24 S16')}</div></div><div><div class="v">${K(ask)}</div><div class="l">indicative 3-year new cash (P50 + ${S.reserve}% reserve); ${K(M.red)} more delivered by redeploying staff</div><div class="s">${EST}</div></div></div>
 ${sec('The case in one page',`<div class="g3"><div class="box"><div class="eyebrow">Situation</div><p>DBMI is HMS’s home for AI and data science in medicine — PhD tracks in AI in Medicine and Bioinformatics &amp; Integrative Genomics, a thesis-based master’s, a 20-year summer institute, an NLM fellowship and a co-hosted coordinating center for the NIH Undiagnosed Diseases Network. ${chips('S28 S29 S1')}</p></div><div class="box"><div class="eyebrow">Complication</div><p>The financial base under that ambition is volatile: funding freezes, a proposed indirect-cost cap, zero-embargo public access, and a School-wide order to cut research spending by at least 20%. ${chips('S17 S16 S14 S21')}</p></div><div class="box"><div class="eyebrow">Resolution</div><p>A 36-month program in three waves — <b>stabilize</b> the research enterprise, <b>build</b> faculty and AI/computational capabilities, then <b>scale</b> partnerships — governed through six decision gates and a balanced scorecard.</p></div></div>`)}
 ${sec('Four programs, eleven initiatives',programCards())}
 ${sec('What I will ask of the Chair in the first 90 days',`<ol class="fx"><li>Confirm the four programs and Wave-1 priorities at <b>Gate 0</b> (month 3).</li><li>Delegate cost and schedule <b>tolerances</b> so routine changes don’t queue for the Chair.</li><li>Approve <b>Wave-1 incremental capacity</b> on fixed-term appointments — no permanent posts: a financial analyst (A1), a part-time compliance specialist (A3) and a part-time AI policy &amp; risk lead (C1).</li><li>Chair a <b>quarterly Portfolio Board</b> with faculty representation.</li><li>Open doors with the <b>Executive Dean for Administration</b>, Faculty Affairs and the Office of Technology Development.</li></ol>`)}
 <div class="callout blue"><b>Evidence labels.</b> ${PUB} published fact (click any S-number) · ${EST} author’s planning estimate — effort assumed, rates published · ${VAL} hypothesis to validate. No DBMI budget, salary or staffing figure is used; none is published.</div>`;});
MD(2,'case','timeline','Operating environment','Ten events in eighteen months',10,()=>`<p class="lead">Harvard returned to surplus in FY2026 on endowment returns and record giving — but federal research revenue fell by a fifth, and the policy risks remain open.</p>${exhibit('timeline','Ten events in eighteen months reshaped the funding and compliance environment','Feb 2025 – Oct 2026','S16 S17 S14 S21 S18 S23 S3 S19')}<div class="callout red"><b>Implication.</b> Plan for volatility, not a return to normal: funding resilience is Wave 1, a reserve is held, and responses to shocks are agreed in advance (module 27).</div>`);
MD(3,'case','bars','Harvard & HMS finances','Surplus, cuts and federal reliance',null,()=>`<p class="lead">University results recovered; HMS remains exposed through sponsored support and a School-wide research spending cut.</p>${exhibit('harvard','Harvard swung from a $113M deficit to a $100M surplus while federal research revenue fell 19.5%','University-wide; FY2025 federal bar derived from the FY2026 decline','S18 S19','FY2025 federal derived (506 ÷ 0.805)')}${exhibit('hms','HMS depends on sponsored support — and was told to cut research spending by at least a fifth','HMS operating revenue mix (Dec 2024); federal reliance (Sep 2025)','S20 S21','Endowment share derived as remainder')}<div class="callout blue"><b>Form 990 context.</b> Harvard’s FY2025 Form 990 reports $2.60B of salaries and wages — 36% of $7.24B total expenses ${chip('S22')}. Its $8.32B revenue includes $3.46B of asset sales, so it is not comparable to the ~$6.7B operating revenue ${chip('S18')}.</div>`);
MD(4,'case','gauge','Indirect-cost exposure','What a 15% cap would remove',null,()=>`<p class="lead">HMS recovers 69% on federal research direct costs; a flat 15% cap — blocked in court but proposed again for FY2027 — would remove 54 cents of recovery per dollar.</p><div class="ctl"><div><label for="mtdc">DBMI annual federal MTDC ($M) — not published</label><input id="mtdc" type="number" min="0" step="0.5" value="${esc(S.mtdc)}" placeholder="e.g. 10"></div><div class="small muted" style="max-width:520px">Arithmetic only: exposure = MTDC × (69% − 15%). Nothing is assumed about DBMI’s actual volume.</div></div>${exhibit('fa','A 15% cap would remove 54 cents of recovery for every dollar of direct research cost','Indirect recovery at the negotiated rate vs the proposed cap','S24 S16','Hypothetical unless entered')}`);
MD(5,'diag','search','DBMI at a glance','Programs, network roles, structure',null,()=>`<p class="lead">Published sources show breadth: degree programs, national-network infrastructure, two computational cores and a defined administrative team. Budgets, loads and service levels are not published — that is what the first sixty days establish.</p><div class="g3">${[['Education',"PhD in Biomedical Informatics (AIM and BIG tracks); MMSc in Biomedical Informatics with a year-long thesis; Summer Institute in its 20th year; NLM data-science postdoctoral fellowship; Clinical Informatics Lecture Series.",'S28 S30'],['National role','Co-host of the NIH Undiagnosed Diseases Network Data Management Coordinating Center (one of six institutions; 23 clinical sites).','S29'],['Administration','Associate Director of Administration, finance and grants team, Associate Director of Research Compliance, Director of Educational Programs, Director of AI Initiatives, Associate Director of Communications; two cores.','S5'],['History','Department since 1 July 2015, evolving from the Center for Biomedical Informatics (2005).','S4'],['School strategy','BEACON: AI and financial resilience at the center; an “AI-enabled campus”.','S1 S3'],['What is not published','Budget, award volume, headcount, service levels — to be established with the Chair and Finance.','']].map(([t,d,s])=>`<div class="box"><div class="eyebrow">${t}</div><p class="small" style="margin:6px 0 0">${d} ${chips(s)}</p></div>`).join('')}</div>`);

 rows.sort((A,B)=>{const a=A.it,b=B.it;if(RAQS.s==='fit')return qFit(a).s-qFit(b).s;if(RAQS.s==='due')return qDue(a)-qDue(b);if(RAQS.s==='unit')return a.u.localeCompare(b.u)||qDue(a)-qDue(b);return urank[a.g]-urank[b.g]||qDue(a)-qDue(b);});
 return {n:rows.length,h:rows.map(({it,i})=>{const u=unitBy(it.u),f=qFit(it);return `<tr><td><span class="qg ${it.g.toLowerCase()}">${it.g}</span></td><td><b>${esc(it.a)}</b><div class="small muted">${esc(it.d)}</div></td><td>${uChip(u)}</td><td class="small">${esc(it.own)}</td><td class="small">${fmtD(qDue(it))}</td><td class="fit ${f.c}">${f.l}</td><td class="small">${esc(it.ctl)}</td><td><button type="button" data-raq="${i}">Open</button></td></tr>`;}).join('')||'<tr><td colspan="8" class="muted">No item matches these filters.</td></tr>'};}

/* briefing builder — deterministic, no AI service */
const RAB={aud:'chair',top:'overview',len:'short'};
const AUD={chair:['Chair','Decision requested'],fac:['Faculty meeting','What this means for your lab'],dean:['Executive Dean for Administration','School-level view'],units:['Unit leads','Actions and owners']};
const TOPIC={overview:'Research portfolio overview',cliff:'Funding cliff & bridge funding',cmp:'Compliance status',edu:'Education programs',cores:'Computational cores',esc:'This month’s escalations'};
function raBrief(){const [aud,frame]=AUD[RAB.aud],nih=nextOf(NIH_NEW),hi=RAQ.filter(x=>x.g==='High'),comp=RAQ.filter(x=>qFit(x).s<0);const end2=SMP.cliff[0]+SMP.cliff[1],pend2=SMP.pend[0]+SMP.pend[1];
 const pub={overview:[`Harvard’s federal research revenue fell 19.5% in FY2026 ${chip('S19')}.`,`HMS on-campus research F&amp;A rate is 69.0% on MTDC ${chip('S24')}; a 15% cap remains proposed ${chip('S16')}.`,`Next NIH new-R01 due date: <b>${fmtD(nih)}</b> (${daysTo(nih)} days) ${chip('S31')}.`],
  cliff:[`HMS held bridge funds in reserve during the 2025 freeze ${chip('S21')}.`,`Federal research revenue fell 19.5% in FY2026 ${chip('S19')}.`,`Next NIH renewal date: <b>${fmtD(nextOf(NIH_REN))}</b> ${chip('S31')}.`],
  cmp:[`2024 NIH Public Access Policy applies to manuscripts accepted on or after 1 Jul 2025 ${chip('S14')}.`,`NIH DMS plans are required at application and the approved plan is expected to be followed ${chip('S15')}.`,`Revised Uniform Guidance took effect 1 Oct 2024 ${chip('S13')}.`],
  edu:[`DBMI runs the PhD in Biomedical Informatics (AIM and BIG tracks) and the MMSc in Biomedical Informatics ${chip('S28')}.`,`The AIM track admitted its first class for fall 2024 ${chip('S30')}.`,`Education is about 11% of HMS operating revenue ${chip('S20')}.`],
  cores:[`DBMI’s site lists a Technology Development Core and a Core for Computational Biomedicine ${chips('S5 S34')}; the role description names the cores differently — to reconcile.`,`Recharge-rate work is Program C2 in this plan.`],
  esc:[`Next NIH new-R01 due date: <b>${fmtD(nih)}</b> ${chip('S31')}.`]}[RAB.top];
 const smp={overview:[`${hi.length} high-urgency items; ${comp.length} with compressed timelines.`,`${fk(end2)} of direct costs ends in the next two quarters against ${fk(pend2)} pending.`],
  cliff:[`${fk(end2)} ends in the next two quarters; ${fk(pend2)} pending (expected value).`,`Largest quarter: ${fk(Math.max(...SMP.cliff))} ending in ${fqLabel(SMP.cliff.indexOf(Math.max(...SMP.cliff))+1)}.`],
  cmp:SMP.cmp.slice(0,3).map(([v,l])=>`${v} ${l}.`),
  edu:SMP.edu.map(([n,a,ad,en])=>`${n}: ${a} applications, ${en} enrolled.`),
  cores:[`Development demand peaks at ${Math.max(...SMP.dev.spon.map((s,i)=>s+SMP.dev.dept[i]+SMP.dev.back[i]))} developer-months against capacity ${SMP.dev.cap}.`,`Computing spend tracks ${((SMP.res.mon.reduce((a,b)=>a+b,0)/SMP.res.budget-1)*100).toFixed(0)}% over budget; ${SMP.res.recov}% recovered.`],
  esc:hi.map(x=>`${x.a} — ${unitBy(x.u).n}, ${qFit(x).l.toLowerCase()}.`)}[RAB.top];
 const dec={chair:['Approve the successor-funding approach for ending awards.','Confirm priorities for core capacity this quarter.'],fac:['Tell your grants manager now if you plan to submit for the next NIH date.','Check that your publications have PMCIDs.'],dean:['Note department exposure and the actions under way.','Advise on School bridge-funding options.'],units:hi.slice(0,3).map(x=>`${unitBy(x.u).n}: ${x.a}.`)}[RAB.aud];
 const li=a=>`<ul>${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;
 const head=`<div class="small muted">To: ${esc(aud)} · Topic: ${esc(TOPIC[RAB.top])} · ${fmtD(today0())}</div><h3 style="font-family:var(--serif);margin:6px 0 10px">${esc(TOPIC[RAB.top])} — ${esc(frame.toLowerCase())}</h3>`;
 const bl=`<p><b>Bottom line.</b> ${RAB.top==='cliff'?'Awards ending soon need successor plans now; the pipeline does not yet cover them.':RAB.top==='cmp'?'Controls are in place; the open items are timing, not gaps in policy.':RAB.top==='edu'?'Programs are established; the oversight focus is outcomes and training-grant obligations.':RAB.top==='cores'?'Demand for both cores exceeds plan; costs need recovery and priorities need agreeing.':'Five units report through one monthly review; a small number of items need a decision this month.'}</p>`;
 return head+bl+`<p><b>What is published</b></p>`+li(pub)+`<p><b>What the sample shows</b> ${SMPC} <span class="small muted">replace with system-of-record extracts before use</span></p>`+li(smp)+(RAB.len==='full'?`<p><b>${esc(frame)}</b></p>`+li(dec)+`<p><b>Next 30 days</b></p>`+li(RAQ.filter(x=>daysTo(qDue(x))<=30).slice(0,4).map(x=>`${fmtD(qDue(x))} — ${esc(x.a)}`)):`<p><b>${esc(frame)}:</b> ${dec[0]}</p>`);}

MD('R1','rov','hub','Research portfolio at a glance','Five units, one portfolio, one review',5,()=>`<p class="lead">The role: oversee the full portfolio of research-related activities and keep it aligned with the department’s academic and research priorities — through five units that report to the Executive Director <span class="small muted">(role description; titles ${chip('S5')})</span>.</p>

${sec('First 90 days in research administration',`<div class="g3">${[['Days 1–30','Map and stabilize',['Meet each unit lead; list services, staff and backlogs','Inventory awards, end dates and salary exposure','Confirm calendars: budget, effort, NIH cycles','Name an owner and backup for every recurring deadline'],'#6E1020'],['Days 31–60','Standardize',['One monthly review format for all five units','Agree measures and targets with unit leads','Publish the escalation rules and control owners','Start the funding-cliff and capacity reviews'],'#85611F'],['Days 61–90','Scale',['First quarterly Portfolio Board with all units','Automate extracts from GMAS and core logs','Brief faculty on what changes for labs','Recommend staffing and system changes'],'#2B5C8A']].map(([d,t,l,c])=>`<div class="move" style="border-top-color:${c}"><div class="k" style="color:${c}">${d}</div><h3>${t}</h3><ul>${l.map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('')}</div>`)}

${exhibit('raAlign','Finance & Grants and Research Compliance carry the institutional load; Educational Programs carries education','Contribution of each unit to the four objectives in the role description','S5','Ratings proposed — to agree with unit leads')}

${sec('How the strategies are executed',`<ol class="fx"><li><b>Annual:</b> each unit sets objectives from the four strategies at budget time; the Chair approves.</li><li><b>Quarterly:</b> Portfolio Board reviews progress, rebalances capacity and funding, and re-scores priorities.</li><li><b>Monthly:</b> one review per unit with the same format — measures, risks, decisions needed.</li><li><b>On trigger:</b> a funding shock, policy change or capacity above 100% brings an out-of-cycle review (module 24).</li><li><b>Tie-breaker:</b> when requests compete for staff or core capacity, the alignment scores above decide the order, and the decision is logged.</li></ol>`)}`);

/* ===== Predictive-model examples: linear-trend forecasts with 80% prediction intervals =====

const MODELCHIP='<span class="chip mdl">MODEL EXAMPLE · synthetic inputs</span>';
const ncdf=z=>{const t=1/(1+.2316419*Math.abs(z)),d=.3989423*Math.exp(-z*z/2),p=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p;};

const pMeet=(c,mdl,k)=>{const f=mdl.at(k),z=(f.raw-c.t)/f.se;return c.d>0?ncdf(z):1-ncdf(z);};
const bdOf=c=>c.u==='%'?[0,100]:c.u==='/5'?[1,5]:[0,Infinity];

const rng=seed=>()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};
/* Beta-PERT sampler (same distribution as the formula view): Marsaglia–Tsang gamma draws on the seeded generator */
const nrm=r=>Math.sqrt(-2*Math.log(1-r()))*Math.cos(2*Math.PI*r());
const gam=(a,r)=>{if(a<1)return gam(a+1,r)*Math.pow(r(),1/a);const d=a-1/3,c=1/Math.sqrt(9*d);for(;;){let x,v;do{x=nrm(r);v=1+c*x;}while(v<=0);v=v*v*v;const u=r();if(u<1-0.0331*x*x*x*x||Math.log(u)<0.5*x*x+d*(1-v+Math.log(v)))return d*v;}};
const pertDraw=(O,Mo,P,r)=>{if(P<=O)return O;const a=1+4*(Mo-O)/(P-O),b=1+4*(P-Mo)/(P-O),x=gam(a,r),y=gam(b,r);return O+(P-O)*x/(x+y);};
const ZQ={.5:0,.8:Z80,.9:1.2816};
const MCC={};const mcRun=(sc=S.scope)=>{const key=JSON.stringify([S.salaryPct,S.escRate,S.escYears,S.fringe,S.extMult,S.toolAdopt,M.tot]);if(MCC[sc]&&MCC[sc].key===key)return MCC[sc];const ls=M.lines.filter(c=>c.l.ini!=='X1'&&(sc==='econ'||c.l.kind!=='Redeploy')),N=5000,r=rng(20261021),sim=new Float64Array(N);let sum=0;for(let k=0;k<N;k++){let t=0;for(const c of ls)t+=pertDraw(c.O,c.M,c.P,r);sim[k]=t;sum+=t;}const so=Array.from(sim).sort((a,b)=>a-b),q=p=>so[Math.min(N-1,Math.floor(p*N))];

function netData(){if(NETC&&NETC.key===M.tot)return NETC;const N=[],E=[],ix={},add=(id,type,label,col,r,extra)=>{ix[id]=N.length;N.push(Object.assign({id,type,label,col,r},extra||{}));};

 INI.forEach(n=>add(n.id,'initiative',n.short,pc(n.p),10+Math.sqrt(M.ini[n.id].mean)*0.55,{p:n.p}));
 RISKS.forEach(r=>add(r.id,'risk',r.name,'#A51C30',8+r.l*r.i*0.35));
 KPIS.forEach((k,i)=>add('K'+i,'measure',k.name,'#2B5C8A',7));
 const link=(a,b,t)=>{if(ix[a]!=null&&ix[b]!=null)E.push({s:ix[a],t:ix[b],type:t});};
 INI.forEach(n=>link('P'+n.p,n.id,'program'));DEPS.forEach(d=>link(d.f,d.t,'feeds'));
 INI.forEach(n=>{iniRisks(n.id).forEach(r=>link(n.id,r.id,'risk'));});KPIS.forEach((k,i)=>link(k.ini,'K'+i,'measure'));

function treemap(items,x,y,w,h){const out=[],tot=items.reduce((a,i)=>a+i.v,0);if(!tot)return out;let rest=items.slice().sort((a,b)=>b.v-a.v).map(i=>({...i,a:i.v/tot*w*h}));

 raHub:()=>mb('Each unit reports in its own format at its own time; the Executive Director sees activity, not the portfolio.','One monthly review per unit in one format, rolled up to one portfolio view tied to the department’s four objectives.','Every unit, every month, same five questions: measures, risks, money, people, decisions needed.',['Agree the format with unit leads in the first 60 days','Name an owner and backup for each measure','Bring cross-unit issues to the quarterly Portfolio Board'])+`<p class="small">Unit names from the role description; published titles ${chip('S5')}. Reporting lines are proposed until confirmed.</p>`,

 raEduCycle:()=>mb('Programs are reviewed only when a training-grant renewal is due.','Five checkpoints a year per program, so outcomes and obligations are visible long before renewal.','No program report is assembled from scratch at deadline.',['Keep trainee outcome tables current each term','Track mentor capacity alongside admissions','Review program net cost annually']),
 raEduFunnel:()=>t2(['Program','Applications','Admitted','Enrolled'],SMP.edu.map(r=>[esc(r[0]),r[1],r[2],r[3]]))+`<p><span class="chip smp">SAMPLE</span> Synthetic values; not DBMI data.</p>`+repl([['Applications, admits, enrolled by program and year','Program admissions records'],['Trainee outcomes','Program records; training-grant tables']]),
 raCmpMap:()=>mb('Compliance is checked once, at proposal, and again only when a problem surfaces.','Each control is placed at the stage where it acts, with an owner and evidence at that stage.','Map controls to the lifecycle; let central offices decide applicability.',['Confirm with central offices which controls apply to which awards','Record evidence in the system of record, not email','Report on-time rates monthly'])+`<p class="small">Sources: ${chips('S15 S14 S32 S13 S10')}. This map does not determine legal or regulatory obligations.</p>`,

 raFinDash:()=>t2(['Quarter','Ending direct costs','Pending (expected)'],SMP.cliff.map((v,i)=>[fqLabel(i+1),fk(v),fk(SMP.pend[i])]))+t2(['Sponsor type','% elapsed','% spent','Award size'],SMP.awards.map(a=>[a[0],a[1]+'%',a[2]+'%',fk(a[3])]))+`<p><span class="chip smp">SAMPLE</span> Synthetic values; not DBMI data.</p>`+repl([['Award end date, budget, expenditure to date','GMAS · financial system'],['Pending proposals and requested amounts','GMAS'],['Salary on award by person','Financial system / payroll']])+mb('Watching total spend only.','Watch what ends each quarter against what is pending, and which awards are off pace.','Successor-funding plan for every award ending within two quarters.',['Quarterly funding-cliff review with PIs','Check under- and over-spenders monthly','Escalate salary exposure to the Chair early']),
 raBridge:()=>t2(['Stage','Count','Median days','Target'],SMP.bridge.map(r=>[esc(r[0]),r[1],r[2]??'—',r[3]??'—']))+`<p><span class="chip smp">SAMPLE</span> Synthetic values.</p>`+repl([['Stage timestamps (created, routed, submitted, awarded, set up, closed)','GMAS']])+`<p class="small">The 20% trigger is adapted from the attached OSP command center.</p>`,

 raRes:()=>t2(['Month','Spend'],['Jul','Aug','Sep','Oct','Nov','Dec','Jan','Feb','Mar','Apr','May','Jun'].map((m,i)=>[m,fk(SMP.res.mon[i])]))+`<p><span class="chip smp">SAMPLE</span> Synthetic values. Harvard fiscal year July–June ${chip('S19')}.</p>`+repl([['Cloud and storage charges by project','Provider billing exports'],['Recharge revenue','Financial system']]),
 raCal:()=>t2(['Event','Dates','Source'],[['NIH new R01 due','Feb 5 · Jun 5 · Oct 5',chip('S31')],['NIH renewal, resubmission, revision R01 due','Mar 5 · Jul 5 · Nov 5',chip('S31')],['NIH council rounds','Aug or Oct · Jan · May',chip('S31')],['NIH earliest start','Sep or Dec · Apr · Jul',chip('S31')],['Harvard fiscal year end','30 June',chip('S19')],['Monthly unit reviews; quarterly Portfolio Board','Proposed','—']])+`<p class="small">Other activity codes and funding notices have their own dates. HMS budget, effort-certification and academic dates are to be confirmed and are not drawn.</p>`,
 raPipe:()=>mb('Mixing published figures, estimates and demo numbers in one chart without labels.','Every figure carries one truth label; SAMPLE values never appear in a report.','If a number has no label, it does not ship.',['Date-stamp every system extract','Keep an extract log with owner and query','Replace SAMPLE values before any external use'])+`<p class="small">Pipeline adapted from the attached OSP command center’s source log; systems ${chips('S32 S33')}.</p>`
,
 stratmap:()=>`<p>A strategy map links objectives across balanced-scorecard levels so each investment shows how it reaches financial and mission outcomes ${chip('S8')}. Click any objective on the map to trace its path.</p>`+t2(['#','Level','Objective','Measure','Initiatives','Owner','Drives'],SMAP.flatMap((t,r)=>t.o.map(([ti,me,ini,own],c)=>[`<b>O${oNum(r,c)}</b>`,esc(t.p),`<b>${esc(ti)}</b>`,me?esc(me):'<span class="chip val">SET AT GATE 1</span>',ini,esc(own),SLINK.filter(l=>l[0]===r&&l[1]===c).map(l=>'O'+oNum(l[2],l[3])).join(', ')||'Outcome'])))+mb('Objectives listed in isolation, or linked by a web of crossing arrows nobody can follow.','Four levels read bottom-up; each objective names its measure, initiatives and owner; links only to the level above.','Every objective must point up to something the Chair cares about — and have one owner.',['Write objectives as outcomes','Link each only to the level it enables','Attach one measure and one owner to each']),
 progtree:()=>t2(['Program','Initiative','Wave','Expected start','Expected finish','P50','P80'],INI.map(n=>[`<b style="color:${pc(n.p)}">${n.p}</b>`,`<b>${n.id}</b> ${esc(n.name)}`,n.wave,fmtM(n.s),fmtM(n.e),K(M.ini[n.id].mean),K(M.ini[n.id].p80)]))+`<p class="small">Dates follow the expected start month (module 18); costs are planning estimates (module 29).</p>`
,
 roiTree:()=>t2(['Lever','Initiatives','Incremental cash','Share of investment','Measure'],LEVERS.map(l=>[`<b style="color:${l.col}">${esc(l.t)}</b>`,l.ini,K(levCost(l)),Math.round(levCost(l)/askNow()*100)+'%',esc(l.m)]).concat([['<b>Reserve</b> — federal policy, outside DBMI’s control','—',K(askBase()*S.reserve/100),Math.round(askBase()*S.reserve/100/askNow()*100)+'%','Scenario triggers (module 27)'],['<b>Total investment</b>','',`<b>${K(askNow())}</b>`,'100%','']]))+mb('Promising the program will “recover” the federal decline, or quoting an ROI nobody can check.','Show what the department controls, what each lever costs, and the break-even it has to clear — then measure the return from baselines.','Claim the break-even; earn the return.',['Get DBMI’s sponsored spending from GMAS','Set lever baselines at Gate 1','Report funding protected each quarter'])+`<p class="small">Pressure figures ${chips('S19 S21 S16')}. Costs: incremental cash by initiative at ${S.conf}; planning estimate.</p>`,
 roiBreak:()=>{const A=askNow()/3,{v:P,real}=portVal();return `<p><b>Method.</b> Annual investment = ${K(askNow())} ÷ 3 = <b>${K(A)}</b>. Funding at risk a year = portfolio × 19.5% = $${P}M × 19.5% = <b>${K(RISK*P*1000)}</b>${real?'':' (illustrative portfolio)'}. Break-even share = annual investment ÷ at-risk funding = <b>${(A/(RISK*P*1000)*100).toFixed(1)}%</b>.</p><p class="small">19.5% is Harvard’s FY2026 federal research decline ${chip('S19')}, used as a stress assumption — DBMI’s own exposure is to validate. This is break-even arithmetic, not a forecast of what the program will achieve.</p>`+t2(['Portfolio','At risk / yr','Must save / yr','Share of at-risk','Share of portfolio'],[5,10,20,30,40,60].map(p=>[`$${p}M`,K(RISK*p*1000),K(A),(A/(RISK*p*1000)*100).toFixed(1)+'%',(A/(p*1000)*100).toFixed(1)+'%']));}
,
 progGantt:()=>{const pid=exCtx.prog||'A';return t2(['Initiative','#','Milestone','Expected date'],INI.filter(n=>n.p===pid).flatMap(n=>PLAN[n.id].ms.map(([m,t],k)=>[`<b>${n.id}</b>`,k+1,esc(t),fmtM(m)])))+`<p class="small">Draft milestones by the author, to confirm with program leads. Dates follow the expected start month (module 18).</p>`;},
 waveStair:()=>t2(['Wave','Released at','Initiatives','P50'],WAVES.map(w=>[esc(w.t),`${w.gate} · ${fmtM(w.rel)}`,INI.filter(n=>n.wave===w.w).map(n=>n.id).join(' '),K(INI.filter(n=>n.wave===w.w).reduce((a,n)=>a+M.ini[n.id].mean,0))]))+`<p class="small">Each gate releases the next wave: G0 approves Wave 1, G1 releases Wave 2 once baselines exist, G2 releases Wave 3 after the Year-1 review.</p>`
,
 staffArea:()=>{const st=STAFF();return t2(['Line','Type','Initiative','Length','FTE','Salary','HMS fringe','Loaded P50'],[...st.New,...st.External,...st.Redeploy].map(x=>{const d=lineDollars(M.lines.find(c=>c.l===x.l));return [esc(roleTitle(x.l))+' <span class="small muted">'+esc(x.l.what)+'</span>',x.l.kind==='New'?'Term hire':x.l.kind==='External'?'Contractor':'Existing staff',x.n.id,`${fmtM(x.ws)} – ${fmtM(x.we)} · ${d.p.n} mo`,d.p.fte.toFixed(2)+' · '+(d.p.hours).toFixed(1)+' of 35 h/wk',d.p.ext?'—':dollars(d.salary),d.p.ext?'No fringe':S.fringe+'% '+dollars(d.fringe),dollars(d.loaded)];}))+`<p class="small">Effort = three-point planning estimate (mean), spread evenly over each line’s months; tool adoption ${S.toolAdopt}% applied. Salary and HMS fringe add to the loaded P50. A term hire’s length is the appointment. A redeployed line is a fraction of someone already employed, for the months shown. ${EST}</p>`+mb('Hiring permanent staff for time-limited program work, or relying on 90-day temps for multi-year tasks.','Redeploy first; hire on term appointments with a fixed end date; buy fixed-scope work as contracts; decide at a gate whether anything continues.','Every new role has an end date and an exit decision before it is approved.',['Confirm term appointment terms with HMS HR','Write the end-of-term decision into each offer','Review at Gates 3 and 4']);},
 staffRoles:()=>t2(['Role','Initiative','FTE and length','Salary and HMS fringe','Employment','End-of-term decision'],STAFF().New.map(x=>{const d=lineDollars(M.lines.find(c=>c.l===x.l));return [esc(roleTitle(x.l)),x.n.id,`${d.p.fte.toFixed(2)} FTE · ${d.p.n} months · ${fmtM(d.p.ws)} – ${fmtM(d.p.we)}`,`Salary ${dollars(d.salary)}<br>HMS fringe ${S.fringe}% ${dollars(d.fringe)}<br><b>${dollars(d.loaded)}</b> loaded`,esc(EXIT[x.n.id][0]),esc(EXIT[x.n.id][1])];}))+`<p class="small">Term appointments ${chips('S38 S39')}; temporary-role limits ${chip('S36')}; contractors via Harvard’s managed service program ${chip('S37')}. Fringe is the HMS staff rate, 35.3% benefits + 10% vacation.</p>`

 quadrant:()=>t2(['Initiative','PV','EV','AC','SV %','CV %'],started().map(n=>{const e=evm(n.id);return [`<b>${n.id}</b> ${esc(n.short)}`,K(e.pv),K(e.ev),K(e.ac),(e.sv/e.pv*100).toFixed(1)+'%',(e.cv/e.ev*100).toFixed(1)+'%'];}))+`<p class="small">SV = EV − PV; CV = EV − AC ${chip('S9')}. ${SMPN} performance values; PV from the plan.</p>`+mb('One colour per program copied across every dimension, or random variances that change on every refresh.','Each dimension from its own rule; one fixed sample shared with the command center.','A status needs a rule and a number behind it.',['Lock baselines at Gate 1','Refresh EV and AC monthly from GMAS','Report anything outside ±5%']),

 eac:()=>`<p>Three estimate-at-completion methods ${chip('S9')}:</p><ul class="fx"><li><b>Bottom-up</b> = AC + (BAC − EV): remaining work at the planned rate.</li><li><b>CPI-based</b> = BAC ÷ CPI: today’s cost efficiency continues.</li><li><b>CPI × SPI</b> = AC + (BAC − EV) ÷ (CPI × SPI): cost and schedule pressure both continue.</li></ul>`+t2(['Initiative','BAC','Bottom-up','CPI-based','CPI×SPI','VAC'],started().map(n=>{const e=evm(n.id);return [n.id,K(e.bac),K(e.eacB),K(e.eacC),K(e.eacX),(e.bac-e.eacX<0?'−':'+')+K(Math.abs(e.bac-e.eacX))];})),
 mc:()=>{const m=mcRun();return `<p>Each run draws every cost line from a Beta-PERT distribution on its optimistic, most-likely and pessimistic values — the same distribution, mean and variance the formula in module 19 uses — and adds them; 5,000 runs with a fixed seed. Lines are treated as independent, which narrows the spread — the fully correlated P80 (every line at its own 80th percentile, normal approximation) is an upper bound ${chip('S9')}.</p>`+t2(['Percentile','Simulated cost'],[[.1,'P10'],[.5,'P50'],[.8,'P80'],[.9,'P90']].map(([p,t])=>[t,K(m.q(p))]).concat([['Fully correlated P80',K(m.corr(.8))]]))+`<p class="small"><b>Why 5,000 runs:</b> the P80 estimate’s sampling error is about ${K(Math.max(1,m.se80))} at 5,000 runs; more runs barely change it. The run count shows the method is stable — it is not evidence that the inputs are right.</p>`+mb('Presenting a simulated cost as a known number, or quoting the run count as if it proved accuracy.','Label every input as published, market or assumed, and say which real data would replace the assumptions.','A simulation is only as good as its least certain input — here, effort.',['Validate effort ranges with program leads (module 21)','Swap market pay for DBMI salary bands when available','Re-run at each gate with actuals']);},
 uncert:()=>{const m=mcRun();return t2(['Line','Type','Variance share'],m.vari.slice(0,12).map(x=>[`${x.c.l.ini} · ${esc(x.c.l.kind==='NL'?x.c.l.what:roleTitle(x.c.l))}`,x.c.l.kind,Math.round(x.v/m.tv*100)+'%']));},
